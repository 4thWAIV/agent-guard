# The architecture language — a second document written in MetaLang.
#
# ── APPROVED — the architecture language, the languages as an enum, and `mark` as a choice. ──
#                                                                                   2026-10-19
# `form` is a declaration of this language; `interface` and the five beside it are its members.
# Neither is a word of MetaLang.
#
# Tim approved this file and its rendered page, and approved declaring the four languages once as
# the enum `languages` rather than as four property names on `equivalent`. He approved that `mark`
# is a choice between a `string` (the glyph) and a `uri` (the location of the mark), where `uri`
# is declared in MetaLang as a `string` carrying the pattern `[A-Za-z][A-Za-z0-9+.-]*:[^\s]+`.
# The approvals arrived through his jarvis session.
#
# Everything in this file is now checked, and the checker says so:
#   - A value written against a choice belongs to whichever option it is a value of. Each glyph
#     below is a `string`; a uri would be a value of both options and is accepted as either.
#   - A bare value on a property typed by an enum names one member of that enum, resolved among
#     that enum's own values. `csharp` in a cell of `equivalents` is the member `csharp` of
#     `languages`. This is how an enum behaves, not a word of MetaLang, and a bare value that
#     names no member is a problem that lists the members.
#   - A property that writes its type out, as `equivalents` writes `set: { of: equivalent }`, is a
#     list whose members are each of the `of` type, with no two the same when the collection is
#     unique. The six lists of cells are read that way.
# The checker never skips or passes what it cannot verify: it reports a blocker or a problem.
#
# `mark` is a choice between a glyph and a uri, approved as a choice between a string and a uri. A
# choice is untagged, so its options have to be distinguishable, and every uri is a string — which
# the checker now reports. So the first option is `glyph`, one character drawn as it is, which
# neither derives from `uri` nor has `uri` deriving from it.
scope: [arch]
import:
  - [metalang]
title: The architecture language
description: What an architecture may contain, written against MetaLang.
declare:
  - entity:
      id: language
      is: object
      title: One language a form may be named in.
      properties:
        name: { is: string, title: The name the language is shown by. }

  - enum:
      id: languages
      is: language
      title: Every language a form is named in, in reading order.
      values:
        - id: csharp
          value: { name: C# }
        - id: python
          value: { name: Python }
        - id: rust
          value: { name: Rust }
        - id: typescript
          value: { name: TypeScript }

  - entity:
      id: equivalent
      is: object
      title: What one form is called in one language.
      description: A form absent from a language says so in the cell rather than leaving it out.
      properties:
        language: { is: languages, title: The language. }
        name: { is: string, title: What that language calls the form. }

  - entity:
      id: glyph
      is: string
      title: One character, drawn as it is.
      constraints:
        - pattern: { value: '[^\s]' }

  - choice:
      id: mark
      options: [glyph, uri]
      title: A glyph, or a uri saying where the glyph is drawn from.

  - entity:
      id: form
      is: object
      title: One kind of declaration an architecture can make.
      description: Every element of an architecture is of exactly one form.
      properties:
        mark: { is: mark, title: "The glyph it is drawn with, or where it is drawn from." }
        example: { is: string, title: A real one from this repository. }
        name: { is: string, title: The name it is shown by. }
        description: { is: string, title: One line saying what the form is. }
        equivalents: { set: { of: equivalent }, title: What each language calls it. }

  - enum:
      id: forms
      is: form
      title: Every form, in reading order.
      values:
        - id: interface
          value:
            mark: "◇"
            example: IGuard
            name: Interface
            description: A declaration of surface with no implementation.
            equivalents:
              - { language: csharp, name: interface }
              - { language: python, name: Protocol or ABC }
              - { language: rust, name: trait }
              - { language: typescript, name: interface }
        - id: class
          value:
            mark: "■"
            example: FileGuard
            name: Class
            description: An implementation satisfying an interface.
            equivalents:
              - { language: csharp, name: class }
              - { language: python, name: class }
              - { language: rust, name: struct with an impl }
              - { language: typescript, name: class }
        - id: record
          value:
            mark: "≡"
            example: Verdict
            name: Record
            description: Data only. No behaviour.
            equivalents:
              - { language: csharp, name: record }
              - { language: python, name: dataclass or NamedTuple }
              - { language: rust, name: struct }
              - { language: typescript, name: "interface, or a type alias" }
        - id: enum
          value:
            mark: "◈"
            example: VerdictKind
            name: Enum
            description: A closed set of values.
            equivalents:
              - { language: csharp, name: enum }
              - { language: python, name: Enum }
              - { language: rust, name: "enum — a sum type, so not the same thing" }
              - { language: typescript, name: "enum, or a union of literals" }
        - id: function
          value:
            mark: "ƒ"
            example: none in this repository
            name: Function
            description: A callable belonging to no type.
            equivalents:
              - { language: csharp, name: none — a static method on a class is the workaround }
              - { language: python, name: def at module level }
              - { language: rust, name: fn at module level }
              - { language: typescript, name: function at module level }
        - id: process
          value:
            mark: "▷"
            example: the Conversation phase
            name: Process
            description: An ordered run of steps with a gate at each end.
            equivalents:
              - { language: csharp, name: none — a process is not a type }
              - { language: python, name: none }
              - { language: rust, name: none }
              - { language: typescript, name: none }
