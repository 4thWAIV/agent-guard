# The architecture language — a second document written in MetaLang.
#
# ── APPROVED — the architecture language, the languages as an enum, and `mark` as a choice. ──
#                                                                                   2026-10-19
# `form` is a declaration of this language; `interface` and the five beside it are its members.
# Neither is a word of MetaLang.
#
# Tim approved this file and its rendered page, and approved declaring the four languages once as
# the enum `languages` rather than as four property names on `equivalent`. He approved that `mark`
# is a choice between a `string` (the glyph) and a `uri` (the location of the mark), where `uri`
# is declared in MetaLang as a `string` carrying the pattern `[A-Za-z][A-Za-z0-9+.-]*:[^\s]+`.
# The approvals arrived through his jarvis session.
#
# Everything in this file is now checked, and the checker says so:
#   - A value written against a choice belongs to whichever option it is a value of, asked
#     narrowest first. Each mark below is a `string`, and a uri would be a `uri`.
#   - A value written against a property whose type is an entity is read one level further down,
#     each key against the property it names. The `appearance` of each form is read that way.
# The checker never skips or passes what it cannot verify: it reports a blocker or a problem.
#
# ── APPROVED — one element, the naming dictionary moved out, and `mark` under `appearance`. ──
#                                                                                   2026-10-21
# Tim approved three changes, through his jarvis session, after the case for each was put to him:
#
#   - `element` is declared here: one named piece of an architecture, carrying which of the six
#     forms it takes and one line saying what it does. Until it existed, a document could call the
#     name of a part anything at all and the checker had no opinion, because this language never
#     said how one piece of an architecture is written down. `ts/metalang/parts.yaml` now derives
#     its `part` from `element` and keeps only the `file` and `mark` it adds of its own.
#   - The naming dictionary — `language`, `languages`, `equivalent`, and the `equivalents`
#     property this file hung on `form` — is now `ts/metalang/names.yaml`, a document written in
#     this language, with one entry for each form in each language. What each language calls a
#     form is naming rather than architecture, and it is also the first half of the verifiable
#     path to each language, which is where the second half will be written.
#   - `mark` now sits under `appearance`, an entity declared here, which is the grouping Tim asked
#     for on 2026-10-18. The `mark` choice itself stays in this file, because
#     `ts/metalang/parts.yaml` names it as a type of its own.
#
# What is left in this file is `form`, `forms`, `element`, and the two declarations that say how a
# form is drawn.
#
# The `function` form's example was the first value this language ever left unwritten. It said so
# in text — "none in this repository" — which read as an answer and was not one, so on 2026-10-20
# it was written as `pending` and the checker reported this document as right and not finished.
# Tim then asked for the example, and it is `reportLines` in `ts/metalang/check.ts`: a callable
# belonging to no type, in the one language in this repository that has them. C# has none, which
# is what the `function_csharp` entry of `ts/metalang/names.yaml` says. `example` still accepts
# `pending`, because the next form with no example to give needs the same word.
#
# `mark` is a choice between a `string` and a `uri`, which is the shape Tim approved. It was
# narrowed on 2026-10-19 to a `glyph` entity declared in this file, because the checker then
# reported any choice where one option derives from another, and every uri is a string. Tim said on
# 2026-10-20 that he never approved that `glyph`, and it has been removed. A narrower option is now
# asked before the one it derives from, so a value carrying a scheme and a colon is a `uri` and
# every other value is a `string`. The `glyph` entity carried a pattern allowing one non-whitespace
# character, and the approved shape has no such limit: any string is now a mark.
# ── APPROVED — one declaration per element, and `name` comes off `element`. ──
#                                                                                   2026-10-24
# Tim approved writing each element as its own declaration rather than as one value of an enum
# listing them all, and approved `constant` gaining the two keywords that let it hold one value of
# a named type. A part of an architecture is now written like this:
#
#   - constant:
#       id: IGuard
#       is: element
#       value:
#         form: interface
#         does: The three behaviours every guard answers a tool call through.
#
# `name` comes off `element` because the declaration's own id is the name of the element. Before
# this, every element carried two names — the id naming it inside its enum, and the `name` it
# actually has — and the one a reader cares about was the second. The full name of an element is
# now its scope and its id, which is how MetaLang names every other declared thing.
#
# Writing them as an enum also said the set was closed. The six forms are a closed set and `forms`
# is rightly an enum: a seventh is a change to this language. The parts of a guard are not that.
#
# The direction this replaces is recorded where it was rejected: declaring the six forms as the six
# kinds an architecture document may write. It required this language to re-declare MetaLang's own
# `declaration` choice and replace its list, it took MetaLang's `enum` away from every document
# written in this language, and it left the file and the glyph in `ts/metalang/parts.yaml` with
# nowhere to live. Tim rejected it on 2026-10-24.
scope: [arch]
import:
  - [metalang]
title: The architecture language
description: What an architecture may contain, written against MetaLang.
declare:
  - choice:
      id: mark
      options: [string, uri]
      title: The character a form is drawn with, or a uri saying where its mark is drawn from.

  - entity:
      id: appearance
      is: object
      title: How a form is drawn, and nothing else about it.
      properties:
        mark: { is: mark, title: "The character it is drawn with, or where it is drawn from." }

  - entity:
      id: form
      is: object
      title: One kind of declaration an architecture can make.
      description: Every element of an architecture is of exactly one form.
      properties:
        appearance: { is: appearance, title: How it is drawn. }
        example:
          is: string
          accepts: [pending]
          title: A real one from this repository.
        name: { is: string, title: The name it is shown by. }
        description: { is: string, title: One line saying what the form is. }

  - enum:
      id: forms
      is: form
      title: Every form, in reading order.
      values:
        - id: interface
          value:
            appearance: { mark: "◇" }
            example: IGuard
            name: Interface
            description: A declaration of surface with no implementation.
        - id: class
          value:
            appearance: { mark: "■" }
            example: FileGuard
            name: Class
            description: An implementation satisfying an interface.
        - id: record
          value:
            appearance: { mark: "≡" }
            example: Verdict
            name: Record
            description: Data only. No behaviour.
        - id: enum
          value:
            appearance: { mark: "◈" }
            example: VerdictKind
            name: Enum
            description: A closed set of values.
        - id: function
          value:
            appearance: { mark: "ƒ" }
            example: reportLines
            name: Function
            description: A callable belonging to no type.
        - id: process
          value:
            appearance: { mark: "▷" }
            example: the Conversation phase
            name: Process
            description: An ordered run of steps with a gate at each end.

  - entity:
      id: element
      is: object
      title: One named piece of an architecture.
      description: The name it is known by is the name it is declared under.
      properties:
        form:
          is: forms
          title: Which of the six forms it takes.
        does:
          is: string
          title: One line saying what it does.
