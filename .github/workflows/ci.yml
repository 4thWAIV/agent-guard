name: CI

# Pass 1 of the pipeline: the quality gate only — build + test all six RIDs' worth of code, run the four
# test legs, and a single gate job PRs must pass. Signing and the release job are added in pass 2.
#
# Version id: one leading `version` job computes it once (Tim's tier A) and passes it to every OS job as
# -p:AgentGuard* args, so all jobs stamp the identical id. dev target => -pre-release, main => none.
#
# The .NET SDK is installed with Microsoft's official dotnet-install script pinned to 10.0.100 — the same
# script used locally — rather than a third-party setup action, to keep outside dependencies to GitHub's own
# first-party actions (per Tim's "only our GitHub dependencies" call). [Implementer choice — say if you want the
# setup-dotnet action instead.] The three first-party actions are commit-id pinned (decision 42).

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      day: ${{ steps.id.outputs.day }}
      time: ${{ steps.id.outputs.time }}
      combined: ${{ steps.id.outputs.combined }}
      hash: ${{ steps.id.outputs.hash }}
      channel: ${{ steps.id.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: id
        # dev target (push to dev, or a PR based on dev) => channel 'dev'; main => '' (no prerelease).
        run: eng/compute-build-id.sh "${{ (github.base_ref == 'dev' || github.ref == 'refs/heads/dev') && 'dev' || '' }}"

  macos:
    needs: version
    runs-on: macos-latest
    env:
      AG: -p:AgentGuardDay=${{ needs.version.outputs.day }} -p:AgentGuardTime=${{ needs.version.outputs.time }} -p:AgentGuardCombined=${{ needs.version.outputs.combined }} -p:AgentGuardHash=${{ needs.version.outputs.hash }} -p:AgentGuardChannel=${{ needs.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned .NET SDK (official script, same as local)
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --version 10.0.100 --install-dir "$RUNNER_TEMP/dotnet"
          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
      - name: Build + publish both mac RIDs (build = the lint/analyzer gate too)
        run: |
          dotnet build -c Release $AG
          dotnet publish src/AgentGuard.Cli/AgentGuard.Cli.csproj -c Release -r osx-arm64 --self-contained $AG
          dotnet publish src/AgentGuard.Cli/AgentGuard.Cli.csproj -c Release -r osx-x64 --self-contained $AG
      - name: Test osx-arm64 (native)
        run: dotnet test -c Release $AG
      - name: Test osx-x64 under Rosetta (must run as X64)
        run: |
          bash "$RUNNER_TEMP/dotnet-install.sh" --version 10.0.100 --architecture x64 --install-dir "$RUNNER_TEMP/dotnet-x64"
          DOTNET_ROOT="$RUNNER_TEMP/dotnet-x64" arch -x86_64 "$RUNNER_TEMP/dotnet-x64/dotnet" test -c Release $AG

  windows:
    needs: version
    runs-on: windows-latest
    env:
      AG: -p:AgentGuardDay=${{ needs.version.outputs.day }} -p:AgentGuardTime=${{ needs.version.outputs.time }} -p:AgentGuardCombined=${{ needs.version.outputs.combined }} -p:AgentGuardHash=${{ needs.version.outputs.hash }} -p:AgentGuardChannel=${{ needs.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned .NET SDK (official script, same as local)
        shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP/dotnet-install.ps1"
          & "$env:RUNNER_TEMP/dotnet-install.ps1" -Version 10.0.100 -InstallDir "$env:RUNNER_TEMP/dotnet"
          "$env:RUNNER_TEMP/dotnet" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build + publish both windows RIDs
        run: |
          dotnet build -c Release $env:AG
          dotnet publish src/AgentGuard.Cli/AgentGuard.Cli.csproj -c Release -r win-x64 --self-contained $env:AG
          dotnet publish src/AgentGuard.Cli/AgentGuard.Cli.csproj -c Release -r win-arm64 --self-contained $env:AG
      - name: Test win-x64 (win-arm64 is build-only, accepted risk)
        run: dotnet test -c Release $env:AG

  linux:
    needs: version
    runs-on: ubuntu-24.04-arm
    env:
      AG: -p:AgentGuardDay=${{ needs.version.outputs.day }} -p:AgentGuardTime=${{ needs.version.outputs.time }} -p:AgentGuardCombined=${{ needs.version.outputs.combined }} -p:AgentGuardHash=${{ needs.version.outputs.hash }} -p:AgentGuardChannel=${{ needs.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned .NET SDK (official script, same as local)
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --version 10.0.100 --install-dir "$RUNNER_TEMP/dotnet"
          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
      - name: Build + publish both linux RIDs
        run: |
          dotnet build -c Release $AG
          dotnet publish src/AgentGuard.Cli/AgentGuard.Cli.csproj -c Release -r linux-arm64 --self-contained $AG
          dotnet publish src/AgentGuard.Cli/AgentGuard.Cli.csproj -c Release -r linux-x64 --self-contained $AG
      - name: Test linux-arm64 (linux-x64 is build-only, accepted risk)
        run: dotnet test -c Release $AG

  # The single check branch protection requires. It goes green only if all three OS jobs succeeded — a
  # skipped or failed OS job cannot green it.
  gate:
    needs: [macos, windows, linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert every OS job succeeded
        run: |
          echo "macos=${{ needs.macos.result }} windows=${{ needs.windows.result }} linux=${{ needs.linux.result }}"
          test "${{ needs.macos.result }}" = "success" \
            && test "${{ needs.windows.result }}" = "success" \
            && test "${{ needs.linux.result }}" = "success"
