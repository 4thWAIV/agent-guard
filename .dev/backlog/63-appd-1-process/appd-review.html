  <script type="application/json" data-review-model>{"title":"appd interface review","stage":"Contract preparation — new requirements not yet contracted","draftStatus":"Every proposed signature and rule is awaiting approval","sources":["src/AgentGuard.Abstractions/Contracts/IPlatformServices.cs","src/AgentGuard.Abstractions/Contracts/IPlatformFileSystem.cs","src/AgentGuard.Abstractions/Contracts/ISystemServices.cs","src/AgentGuard.Abstractions/Contracts/IBuildInfo.cs","src/AgentGuard.Engine/Setup/ISetupCondition.cs","src/AgentGuard.Engine/Setup/SetupConditions.cs","src/AgentGuard.Engine/Setup/MachinePaths.cs",".dev/inprocess/63-appd-1-process/conversation.md",".dev/inprocess/63-appd-1-process/design-output.json",".dev/inprocess/63-appd-1-process/autostart-research.md"],"nodes":[{"id":"client","layer":0,"label":"CLI / future dashboard","status":"Consumer","code":"// Existing entry points: install and doctor.\n// Proposed appd consumers: status, start and stop.\n// Dashboard is a future consumer of the same service surface.","question":"Which operations should both the CLI and dashboard reach?","paths":["start","stop","configure"],"rules":[15]},{"id":"daemon-command","layer":0,"label":"agentguard daemon","status":"Approved verb; unbuilt","code":"// Entry point reached by the OS service manager.\n// Acquires the single-instance lock, then runs until stopped.\n// It does not call StartAsync again.","question":"The daemon entry point and the client-side start operation are separate call paths.","paths":["host"],"rules":[12,15]},{"id":"runtime","layer":1,"label":"IDaemonService","status":"Draft interface","code":"public interface IDaemonService\n{\n    bool IsRunning();\n    Task StartAsync(CancellationToken ct);\n    Task StopAsync(CancellationToken ct);\n}","question":"Review these operation names, return types and cancellation shape. Start and stop report failure by exception; returning means the requested state was observed. That behavior is proposed, not approved.","paths":["start","stop"],"rules":[4,9]},{"id":"autostart-service","layer":1,"label":"IAutostartEntryService","status":"Draft interface","code":"public interface IAutostartEntryService\n{\n    Task\u003cAutostartEntryState> InspectAsync(CancellationToken ct);\n    Task SetEnabledAsync(bool enabled, CancellationToken ct);\n}\n\n// AutostartEntryState: result shape is still unwritten.\n// It needs existence, enabled state and actionable diagnosis.\n// Retry/log settings are not silently hidden in a DTO.\n// Their operations follow the policy decision.","question":"Runtime and persistent configuration have separate owners in this candidate. Installation/removal stay with setup. The inspection result and further settings remain explicit design questions.","paths":["configure"],"rules":[4]},{"id":"service-implementation","layer":2,"label":"DaemonService","status":"Draft middle layer","code":"// StartAsync:\n//   probe lock -> inspect entry if needed -> OS start -> observe lock\n// StopAsync:\n//   probe lock -> OS stop -> observe lock released\n// No arbitrary executable, command or lock path comes from callers.\n// Timeout values and failure result contracts are undecided.","question":"This is the wiring between the top interface and OS abstraction. Its method bodies are not being approved through this diagram.","paths":["start","stop"],"rules":[4,9]},{"id":"setup-implementation","layer":2,"label":"AutostartEntryService + setup","status":"Draft extension","currentPath":"src/AgentGuard.Engine/Setup/ISetupCondition.cs","code":"// Reuse ISetupCondition for install and doctor.\n// One AutostartEntryCondition owns checking/repairing setup.\n// AutostartEntryService exposes user configuration.\n// Both call the same platform entry adapter.\n// Existing Detect/Repair are synchronous; proposed platform I/O\n// is asynchronous. Their integration is unresolved, not hidden.","question":"Inspect the current ISetupCondition below. We must settle its synchronous boundary before introducing async setup work. Doctor must preserve an intentionally disabled entry.","paths":["configure"],"rules":[4,13]},{"id":"host","layer":2,"label":"DaemonHost","status":"Draft middle layer","code":"// TryAcquire -> hold lease -> one cancellation-linked await\n// Stop releases the lease when the process exits.\n// Stop signalling and shutdown lifetime still need a mechanism.\n// Duplicate acquisition never becomes a second daemon.","question":"The approved stop command adds shutdown work absent from the recorded DESIGN. This diagram does not claim the old idle-loop design implements stop. Mutex ownership must survive the wait on the same thread; the earlier cancellation-linked await alone does not establish that.","paths":["host"],"rules":[8,12]},{"id":"platform","layer":3,"label":"IPlatformServices","status":"Exists; extension proposed","currentPath":"src/AgentGuard.Abstractions/Contracts/IPlatformServices.cs","code":"public interface IPlatformServices\n{\n    IPlatformFileSystem FileSystem { get; }\n    IPresenceCheck Presence { get; }\n    IPlatformDaemon Daemon { get; } // Proposed\n}\n\npublic interface IPlatformDaemon\n{\n    ISingleInstanceLock Lock { get; }\n    IDaemonProcessControl Process { get; }\n    IAutostartEntry AutostartEntry { get; }\n}","question":"One daemon property containing three capabilities, or three direct properties? The grouping selector changes the actual declaration shown here.","paths":["start","stop","configure","host"],"rules":[10]},{"id":"lock","layer":4,"label":"ISingleInstanceLock","status":"Draft interface","code":"public interface ISingleInstanceLock\n{\n    bool IsHeld(ISystemServices services);\n    IDisposable? TryAcquire(ISystemServices services);\n}\n\n// Proposed: null means another instance owns the lock.\n// A returned lease is held for the daemon lifetime.\n// All other failures remain distinguishable from contention.","question":"Review nullable lease versus a dedicated result/lease interface. Lock paths are computed inside each platform implementation, not supplied by a caller. Windows release is thread-affine; the generic IDisposable lease must preserve the acquiring thread, or the host lifetime must do so. No threading mechanism is silently selected.","paths":["start","stop","host"],"rules":[1,2,3,4,6,7,8,9]},{"id":"process","layer":4,"label":"IDaemonProcessControl","status":"Draft interface","code":"public interface IDaemonProcessControl\n{\n    Task StartAsync(ISystemServices services, CancellationToken ct);\n    Task StopAsync(ISystemServices services, CancellationToken ct);\n}\n\n// Only the appd entry belonging to the current user/scope.\n// No command, executable, PID or target-session argument.","question":"Review one start/stop interface versus separate interfaces. The OS adapter derives the client scope. Windows session-targeted COM is proposed but not approved.","paths":["start","stop"],"rules":[0,3,4,5,8,9,11]},{"id":"entry","layer":4,"label":"IAutostartEntry","status":"Draft interface","code":"public interface IAutostartEntry\n{\n    Task\u003cAutostartEntryState> InspectAsync(\n        ISystemServices services, CancellationToken ct);\n    Task ApplyAsync(AutostartEntryDefinition definition,\n        ISystemServices services, CancellationToken ct);\n    Task RemoveAsync(ISystemServices services, CancellationToken ct);\n}\n\n// AutostartEntryDefinition is unwritten pending policy approval.\n// It must carry the existing MachinePaths-owned launcher path.\n// It must not become an arbitrary-command escape hatch.","question":"The parameter/return shapes are draft C#, with unresolved DTOs clearly named. Launch conditions, retry settings and logging must be decided before these data contracts can be completed.","paths":["configure","start"],"rules":[3,4,5,8,9,13]},{"id":"templates","layer":4,"label":"IAssemblyResources","status":"Draft interface","currentPath":"src/AgentGuard.Abstractions/Contracts/IBuildInfo.cs","question":"The proposed resource service returns an owned IReadStream rather than raw Stream. Its Assembly reader and text-reader/bridge interfaces are now shown in the native layer. Review whether preserving the stream-shaped API is worth those extra wrappers, versus an explicitly composed text-resource service. Existing IBuildInfo is unchanged.","paths":["configure"],"rules":[0,10],"codeFrom":"native-resources","code":"internal interface IAssemblyResources\n{\n    IReadStream? GetManifestResourceStream(string name);\n}\n\ninternal interface IReadStream : IDisposable\n{\n    int Read(byte[] buffer, int offset, int count);\n}"},{"id":"private-directory","layer":4,"label":"IPlatformFileSystem","status":"Exists; member proposed","currentPath":"src/AgentGuard.Abstractions/Contracts/IPlatformFileSystem.cs","code":"// Proposed addition to the existing IPlatformFileSystem:\nvoid EnsurePrivateDirectory(string path);\n\n// POSIX: create or verify the lock directory is private.\n// Windows: the lock uses a named mutex, not this directory.\n// Decide whether this method is POSIX-only or provides\n// equivalent private-directory behavior on Windows too.","question":"The recorded DESIGN proposes a Windows throw, following MakeExecutable. Do we want that platform-limited operation or an OS-uniform contract? Do not silently infer Windows ACL behavior.","paths":["host","start"],"rules":[1,6]},{"id":"macos","layer":5,"label":"macOS adapters","status":"Unbuilt","code":"// Lock: exclusive FileStream in the approved runtime directory.\n// Start: launchctl bootstrap if absent, then kickstart (no -k).\n// Stop candidate: bootout this user's loaded appd job.\n// Entry: LaunchAgent plist read by launchd.\n// Command runner is shared with Linux; no duplicate Process owner.","question":"Manual-start-only mode and stop must not accidentally re-enable login startup. Restart policy determines how this adapter manages the loaded job.","paths":["start","stop","configure","host"],"rules":[0,1,5,6,7,13,14]},{"id":"linux","layer":5,"label":"Linux adapters","status":"Unbuilt","code":"// Lock: exclusive FileStream under XDG_RUNTIME_DIR.\n// Start/stop: systemctl --user start/stop agentguard-appd.service.\n// Entry enable/disable: unit install links, never mask.\n// Shared Process adapter runs systemctl.\n// Desktop connection mechanism is still undecided.","question":"Starting at default.target can precede the desktop. Graphical-session startup needs integration; a daemon started earlier needs an explicit later UI connection.","paths":["start","stop","configure","host"],"rules":[0,1,5,6,13,14]},{"id":"windows","layer":5,"label":"Windows adapters","status":"Session targeting proposed","code":"// Lock: Local\\ named mutex, scoped to the logon session.\n// Task: \\AgentGuard\\appd-\u003cuser SID>.\n// Start candidate: IRegisteredTask.RunEx with caller session ID.\n// Stop candidate: IRunningTask.Stop on the matching instance.\n// Task permits Parallel; the mutex refuses same-session duplicates.\n// Exact instance-to-session selection is still unwritten.","question":"COM replaces schtasks for explicit session targeting in this candidate. This needs approval, a mirrored native wrapper, and Windows multi-session proof.","paths":["start","stop","configure","host"],"rules":[2,5,14]},{"id":"native-process","label":"Process + start options","code":"internal interface IProcessFactory\n{\n    IProcess Create();\n    IProcess GetCurrentProcess();\n    IProcess GetProcessById(int processId);\n}\n\ninternal interface IProcess : IDisposable\n{\n    IProcessStartInfo StartInfo { get; }\n    int Id { get; }\n    int SessionId { get; }\n    bool HasExited { get; }\n    int ExitCode { get; }\n    ITextReader StandardOutput { get; }\n    ITextReader StandardError { get; }\n\n    bool Start();\n    Task WaitForExitAsync(CancellationToken cancellationToken);\n    void Kill(bool entireProcessTree);\n}\n\ninternal interface IProcessStartInfo\n{\n    string FileName { get; set; }\n    Collection\u003cstring> ArgumentList { get; }\n    string WorkingDirectory { get; set; }\n    bool UseShellExecute { get; set; }\n    bool RedirectStandardOutput { get; set; }\n    bool RedirectStandardError { get; set; }\n    bool CreateNoWindow { get; set; }\n    Encoding? StandardOutputEncoding { get; set; }\n    Encoding? StandardErrorEncoding { get; set; }\n}","question":"Proposed owners: ProcessFactory creates AbstractedProcess; its StartInfo property exposes an AbstractedProcessStartInfo. Names and members mirror the BCL, with owned interfaces replacing actionable raw objects. The shared command runner uses these on macOS and Linux; Windows also uses process identity/session reads. Start/stop policy and timeout decisions stay above these wrappers. StandardOutput and StandardError are borrowed readers owned by IProcess; drain both concurrently before awaiting exit. Kill is for the launched service-manager command on cancellation, not a second way to launch or stop appd. SessionId is used by Windows, not as a POSIX daemon scope.","rules":[0,3,8,10,11],"paths":["start","stop","configure"],"sources":["https://learn.microsoft.com/en-us/dotnet/api/system.diagnostics.process?view=net-10.0","https://learn.microsoft.com/en-us/dotnet/api/system.diagnostics.processstartinfo?view=net-10.0"],"layer":6,"status":"Proposed C# · unapproved"},{"id":"native-file","label":"FileStream lifetime","code":"internal interface IFileStreamFactory\n{\n    IFileStream Create(\n        string path,\n        FileMode mode,\n        FileAccess access,\n        FileShare share);\n}\n\ninternal interface IFileStream : IDisposable\n{\n}","question":"Proposed owners: FileStreamFactory creates AbstractedFileStream, the sole raw FileStream owner. Dispose is the only operation needed on this lock handle; no read, write, path-discovery or unlink operation is added. Create mirrors the FileStream constructor. The lock adapter supplies OpenOrCreate, ReadWrite and None after computing the approved runtime path. The returned object keeps that open file alive; disposal closes it. Only the lock adapter interprets an expected sharing conflict as contention. Other I/O failures remain errors. This is a lifetime-only interface, not a missing implementation.","rules":[1,6,7,8,10],"paths":["start","stop","host"],"sources":["https://learn.microsoft.com/en-us/dotnet/api/system.io.filestream.-ctor?view=net-10.0"],"layer":6,"status":"Proposed C# · unapproved"},{"id":"native-mutex","label":"Mutex lifetime","code":"internal interface IMutexFactory\n{\n    IMutex Create(bool initiallyOwned, string name, out bool createdNew);\n    bool TryOpenExisting(string name, [NotNullWhen(true)] out IMutex? result);\n}\n\ninternal interface IMutex : IDisposable\n{\n    bool WaitOne(int millisecondsTimeout);\n    void ReleaseMutex();\n}","question":"Proposed owners: MutexFactory creates AbstractedMutex, the sole raw Mutex owner. Create mirrors the constructor; TryOpenExisting, WaitOne and ReleaseMutex mirror BCL members. Dispose closes the handle; it is not a substitute for ReleaseMutex. Acquisition and release must happen on the same thread. A lease held across arbitrary awaits cannot silently promise that. The host still needs either a dedicated owning thread or a synchronous owning lifetime. An abandoned mutex grants ownership while throwing AbandonedMutexException; that case needs explicit handling, not a false 'not running' answer. The wrapper does not choose the Local\\\\ name or decide what contention means.","rules":[2,8,9,10],"paths":["start","stop","host"],"sources":["https://learn.microsoft.com/en-us/dotnet/api/system.threading.mutex?view=net-10.0","https://learn.microsoft.com/en-us/dotnet/standard/threading/mutexes"],"layer":6,"status":"Proposed C# · unapproved"},{"id":"native-tasks","label":"Task Scheduler objects","code":"internal interface ITaskServiceFactory\n{\n    ITaskService Create();\n}\n\ninternal interface ITaskService : IDisposable\n{\n    void Connect();\n    ITaskFolder GetFolder(string path);\n}\n\ninternal interface ITaskFolder : IDisposable\n{\n    ITaskFolder CreateFolder(string subFolderName, string? sddl);\n    IRegisteredTask GetTask(string path);\n    IRegisteredTask RegisterTask(\n        string path,\n        string xmlText,\n        int flags,\n        string? userId,\n        string? password,\n        int logonType,\n        string? sddl);\n    void DeleteTask(string name, int flags);\n}\n\ninternal interface IRegisteredTask : IDisposable\n{\n    string Path { get; }\n    string Xml { get; }\n    bool Enabled { get; }\n    IRunningTask RunEx(\n        string[]? parameters,\n        int flags,\n        int sessionId,\n        string? user);\n    IRunningTaskCollection GetInstances(int flags);\n}\n\ninternal interface IRunningTaskCollection : IDisposable\n{\n    int Count { get; }\n    IRunningTask this[int index] { get; }\n}\n\ninternal interface IRunningTask : IDisposable\n{\n    string Path { get; }\n    string InstanceGuid { get; }\n    uint EnginePID { get; }\n    void Refresh();\n    void Stop();\n}","question":"Proposed owners: TaskServiceFactory and one Abstracted wrapper per returned COM interface, all in the Windows assembly. This is an owned C# review surface, NOT a COM ABI declaration. Connect selects local/current credentials. String/string-array parameters cover the needed BSTR and empty VARIANT cases; no object/dynamic escape hatch is proposed. Native flags retain their integer types; the appd adapter pins the allowed values. Collection indexing follows COM's 1-based index. Each returned wrapper is an owned reference disposed by its caller. Disposing a wrapper releases the COM reference; it does not stop the task. RunEx is the proposed replacement for schtasks, not an approved change. For stop, compare each instance's EnginePID session via IProcessFactory.GetProcessById, then Stop the matching instance. That selection is a candidate requiring Windows multi-session and process-exit-race proof; EnginePID is the task engine PID, not an assertion that it is appd's PID. COM activation, apartment handling and ABI marshalling remain an implementation-design review, not implied by these signatures.","rules":[4,5,8,10,14],"paths":["start","stop","configure"],"sources":["https://learn.microsoft.com/en-us/windows/win32/api/taskschd/nf-taskschd-itaskservice-connect","https://learn.microsoft.com/en-us/windows/win32/api/taskschd/nf-taskschd-itaskfolder-registertask","https://learn.microsoft.com/en-us/windows/win32/api/taskschd/nf-taskschd-iregisteredtask-runex","https://learn.microsoft.com/en-us/windows/win32/api/taskschd/nf-taskschd-iregisteredtask-getinstances","https://learn.microsoft.com/en-us/windows/win32/api/taskschd/nf-taskschd-irunningtask-get_enginepid"],"layer":6,"status":"Proposed C# · unapproved"},{"id":"native-resources","label":"Assembly resource streams","code":"internal interface IAssemblyResources\n{\n    IReadStream? GetManifestResourceStream(string name);\n}\n\ninternal interface IReadStream : IDisposable\n{\n    int Read(byte[] buffer, int offset, int count);\n}","question":"Proposed owner: AssemblyResourcesAdapter reads resources from the assembly selected at composition and returns an owned read-stream wrapper. GetManifestResourceStream mirrors Assembly's name and missing-resource null result; IReadStream replaces the raw Stream. The caller disposes the returned stream. The resource reader does not choose a template identifier, substitute placeholders or decide that a missing embedded template is acceptable. Template code makes missing data an actionable error. This replaces the old draft that leaked Stream. Existing IBuildInfo remains a version-metadata interface and is not extended for resources. StreamReader construction is shown in the separate Text readers node, including the necessary owned-stream bridge.","rules":[0,8,10,13],"paths":["configure"],"sources":["https://learn.microsoft.com/en-us/dotnet/api/system.reflection.assembly.getmanifestresourcestream?view=net-10.0"],"layer":6,"status":"Proposed C# · unapproved"},{"id":"native-readers","label":"Text readers + bridge","code":"internal interface ITextReader : IDisposable\n{\n    string ReadToEnd();\n    Task\u003cstring> ReadToEndAsync(CancellationToken cancellationToken);\n}\n\ninternal interface IStreamReaderFactory\n{\n    ITextReader Create(\n        IReadStream stream,\n        Encoding encoding,\n        bool detectEncodingFromByteOrderMarks,\n        int bufferSize,\n        bool leaveOpen);\n}\n\ninternal interface IReadStreamBridgeFactory\n{\n    IReadStreamBridge Create(IReadStream stream, bool leaveOpen);\n}\n\ninternal interface IReadStreamBridge : IReadStream\n{\n    bool CanRead { get; }\n    bool CanSeek { get; }\n    bool CanWrite { get; }\n    long Length { get; }\n    long Position { get; set; }\n    void Flush();\n    long Seek(long offset, SeekOrigin origin);\n    void SetLength(long value);\n    void Write(byte[] buffer, int offset, int count);\n}","question":"Proposed owners: AbstractedTextReader is the one TextReader/StreamReader wrapper, shared by process output and resource reading. StreamReaderFactory uses the BCL decoder rather than rebuilding text decoding. Because that constructor accepts a raw Stream, an owned bridge is needed: ReadStreamBridge implements IReadStreamBridge and derives from Stream, forwarding Read to the supplied IReadStream. StreamReaderFactory obtains it through IReadStreamBridgeFactory; an internal composition-only conversion supplies its Stream view to the BCL constructor. That conversion and its analyzer allowance require review; it must never downcast an arbitrary IReadStream or fail for a fake. This added bridge is the visible cost of preserving both the Assembly stream surface and the no-raw-object boundary. Seek/write/length operations on the read-only non-seekable bridge throw NotSupportedException; they are Stream's abstract members, not new template capabilities. leaveOpen defines whether reader disposal closes the supplied stream. Process-owned readers remain borrowed by the command runner; their lifetime ends with IProcess. Alternative requiring approval: expose a composed ReadAllText resource service, eliminating the public stream/reader bridge but no longer presenting a one-for-one Assembly boundary.","rules":[0,8,10,11],"paths":["start","stop","configure"],"sources":["https://learn.microsoft.com/en-us/dotnet/api/system.io.textreader?view=net-10.0","https://learn.microsoft.com/en-us/dotnet/api/system.io.streamreader.-ctor?view=net-10.0"],"layer":6,"status":"Proposed C# · unapproved"},{"id":"native-identity","label":"Windows account identity","code":"internal interface IWindowsIdentityFactory\n{\n    IWindowsIdentity GetCurrent();\n}\n\ninternal interface IWindowsIdentity : IDisposable\n{\n    ISecurityIdentifier? User { get; }\n}\n\ninternal interface ISecurityIdentifier\n{\n    string Value { get; }\n}","question":"Proposed owners: WindowsIdentityFactory creates AbstractedWindowsIdentity; User returns an AbstractedSecurityIdentifier. These mirror WindowsIdentity.GetCurrent, WindowsIdentity.User and SecurityIdentifier.Value without exposing a raw identity object. The Windows autostart adapter derives the approved per-user task name from that SID. A missing User value is an error, not a fallback to a shared task name. The account SID and the process SessionId are different values and serve different purposes. The identity owner is confined to the Windows assembly.","rules":[3,10,13,14],"paths":["start","stop","configure"],"sources":["https://learn.microsoft.com/en-us/dotnet/api/system.security.principal.windowsidentity.getcurrent?view=net-10.0"],"layer":6,"status":"Proposed C# · unapproved"}],"edges":[["client","runtime"],["client","autostart-service"],["daemon-command","host"],["runtime","service-implementation"],["autostart-service","setup-implementation"],["service-implementation","platform"],["setup-implementation","platform"],["host","platform"],["platform","lock"],["platform","process"],["platform","entry"],["setup-implementation","templates"],["lock","private-directory"],["lock","macos"],["lock","linux"],["lock","windows"],["process","macos"],["process","linux"],["process","windows"],["entry","macos"],["entry","linux"],["entry","windows"],["macos","native-process"],["linux","native-process"],["macos","native-file"],["linux","native-file"],["windows","native-mutex"],["windows","native-tasks"],["windows","native-process"],["windows","native-identity"],["templates","native-resources"],["native-process","native-readers"],["native-resources","native-readers"]],"ruleExamples":[{"label":"Own Process launch once","bad":"new ProcessStartInfo(...) // inside DaemonService","good":"// One Process adapter in CrossPlatform;\n// macOS and Linux invoke it through an owned interface.","review":"Windows COM reduces the Windows need for the shared command runner. Its owner still serves macOS and Linux."},{"label":"Own POSIX file locking","bad":"new FileStream(path, ...) // outside the lock owner","good":"platform.Daemon.Lock.TryAcquire(services);","review":"Lease disposal must release the file handle; do not expose the raw FileStream."},{"label":"Own Windows mutex access","bad":"new Mutex(false, name) // inside Engine","good":"platform.Daemon.Lock.TryAcquire(services);","review":"The mutex owner and lease shape remain to be approved."},{"label":"No caller-supplied command or lock path","bad":"StartAsync(string executable, string arguments)","good":"StartAsync(ISystemServices services, CancellationToken ct)","review":"Definition DTOs need inspection too; placing arbitrary commands inside a DTO would evade a parameter-only rule."},{"label":"Pin each operation to its caller","bad":"// Any unrelated Engine class calls the raw start port.","good":"// DaemonService owns start/stop; setup owns writes.","review":"The recorded text gives Detect to the setup condition, but the selected design also calls Detect from DaemonGate. Resolve that caller-table contradiction and add stop/configuration callers."},{"label":"Confine service-manager tool names","bad":"// Another Engine type embeds \"systemctl\".","good":"// The per-OS adapter owns the fixed tool invocation.","review":"Entry writing also needs service-manager operations. The recorded start-owner-only allowance must account for that owner and the Windows COM proposal."},{"label":"Confine runtime-directory discovery","bad":"// A second component computes XDG_RUNTIME_DIR/appd.lock.","good":"// Both probe and acquire use the lock owner's path.","review":"Review each banned variable against existing legitimate consumers. A global HOME ban can exceed the lock-path concern."},{"label":"Constrain the macOS temp exemption","bad":"[assembly: SuppressMessage(..., \"AGS5443\")]","good":"// Suppression only on the approved macOS lock-path member.","review":"The full approved exemption must enter the contract. Attribute scanning alone does not cover every suppression mechanism."},{"label":"No broad exception catch","bad":"catch (Exception) { return false; }","good":"// Catch a specific expected lock-contention exception.\n// Preserve other errors for diagnosis.","review":"This is a scoped proposal, not a general ban on every exception boundary."},{"label":"No mutable state in adapters","bad":"private bool isRunning; // cached OS state","good":"private readonly IProcessLauncher launcher;","review":"A lifetime lease legitimately owns a handle. Distinguish the lease from stateless adapters; do not ban the state the mechanism needs."},{"label":"Cover every interface owner","bad":"// A production service interface is unreachable and unregistered.","good":"// Container-reachable interface or explicitly governed native owner.","review":"The shared launcher and resource/COM wrappers require coverage. Internal interfaces outside Contracts must not fall through this rule."},{"label":"Use the injected clock for waits","bad":"process.WaitForExit(30000);","good":"await process.WaitForExitAsync(clockBoundCancellation);","review":"Example is schematic. Verify the actual timeout source and cancellation; async alone does not prove clock ownership."},{"label":"No idle polling loop","bad":"while (true) { await Delay(...); ProbeLock(); }","good":"await shutdown.WaitAsync(ct); // one lifetime await","review":"The new stop operation needs shutdown signalling. This example illustrates the rule and does not select a shutdown interface."},{"label":"Pin templates to their identifiers","bad":"// Template and C# disagree about the task name or launcher.","good":"Assert.Equal(expectedLauncher, writtenDefinition.Command);","review":"Use the approved Windows appd-\u003cuser SID> name, not the old constant task name in the recorded rule. Pin rendered definitions, including escaping."},{"label":"Require real per-OS adapter coverage","bad":"// Windows task adapter has only fake-based unit tests.","good":"// NativeSpec exercises the real adapter on its OS.","review":"Marker discovery must cover interfaces declared in Contracts. Include multi-session start/stop and disabled-autostart behavior."},{"label":"Pin presence-gated commands","bad":"// daemon prompts for presence on every login.","good":"// daemon stays ungated; existing install/init/remove stay gated.","review":"The new stop and autostart configuration operations need an explicit presence policy before this fixed verb-set rule can be approved."}],"policies":[{"id":"demand","label":"Recover on the next client request","recommendation":"Recommended for the first common policy","reason":"Same recovery semantics on all three OSes, with no background restart loop to fight stop or disabled autostart.","decision":"A crash leaves appd stopped until the next command needing it starts it through the OS service manager. Login startup remains enabled by default. This trades immediate unattended recovery for consistent behavior.","rows":[["Login enabled","RunAtLoad=true; no KeepAlive","Enable the user unit's login target link","Enabled LogonTrigger for the user's SID"],["Login disabled","RunAtLoad=false; no KeepAlive; retain the definition","Disable the login target link; do not mask","Disable LogonTrigger; leave the task enabled"],["Crash","No automatic respawn","Restart=no","Omit RestartOnFailure"],["Explicit start","Bootstrap if unloaded, then kickstart","systemctl --user start","RunEx with caller's session ID (proposal)"],["Explicit stop","bootout the loaded job; retain plist","systemctl --user stop","Stop the matching task instance (selection unresolved)"],["After explicit stop","A later client request or next enabled login may start appd","Same","Same"],["Re-enable login","Write RunAtLoad=true for the next load/login","Restore the user-unit install link","Re-enable the SID LogonTrigger"],["Change while running","Login-setting change does not stop appd; no forced reload","enable/disable does not stop the active service","Change the trigger; do not stop the running instance"],["Battery / idle / network","No extra conditions proposed","No extra conditions proposed","DisallowStartIfOnBatteries=false; StopIfGoingOnBatteries=false; no idle/network conditions"],["Runtime limit","No forced lifetime limit","No RuntimeMaxSec limit","ExecutionTimeLimit=PT0S"],["Log out","LaunchAgent follows the user GUI domain","User-manager lifetime depends on lingering and session configuration; policy unresolved","InteractiveToken requires an interactive login; logoff/disconnect behavior requires a multi-session test"],["Readiness","Start succeeds after observing the appd lock, not merely launchctl exit","Same distinction for systemctl","Same distinction for RunEx"]]},{"id":"native","label":"Let each OS retry after a crash","recommendation":"Alternative; behavior differs by OS","reason":"Restores an unused daemon without waiting for a client, but the managers do not offer the same retry controls.","decision":"Proposed comparison values: 60 seconds, with three retries where meaningful. These settings are not an approved common contract.","rows":[["Restart setting","KeepAlive.SuccessfulExit=false","Restart=on-failure; RestartSec=60s","RestartOnFailure: Interval=PT1M; Count=3"],["Retry limit","No documented count cap","StartLimitBurst counts starts in a time window, not consecutive retries","Finite restart count"],["Timing","ThrottleInterval=60 limits launch frequency","Wait 60 seconds after failure","Restart interval of one minute"],["Disable login only","Unresolved with KeepAlive: it implies RunAtLoad","Disable target link; recovery policy can remain","Disable LogonTrigger; recovery policy can remain"],["Explicit stop","Unload the job to stop KeepAlive respawning it","OS stop suppresses automatic restart","Stop a specific running instance; retry behavior needs a Windows test"],["Uniformity cost","Different cap and login-toggle semantics","Rate window differs from a retry counter","Finite count and per-session behavior need proof"]]}],"logging":{"proposal":"appd writes its own bounded log on every OS","reason":"Task Scheduler cannot redirect stdout/stderr in its executable action, so service-manager redirection cannot provide the same log on all three.","draft":"Proposed location: ~/.agentguard/logs/appd-\u003cscope>.jsonl\nProposed fields: time, level, event, message\nProposed limit: 5 MiB per file, one previous file per scope\nWindows scope includes session ID; POSIX uses account scope.\nNo secrets, environment dumps or user-request payloads.\nLocation, schema, limit and reading command all await approval.\nNo total retention bound across expired Windows sessions is selected.","question":"Keep this common file log, or use each OS's native logging system and accept different viewing tools? No logger has been selected or built. Session-log cleanup and startup failures before the logger opens also need a mechanism."},"blockers":["Windows session-targeted start and stop are proposals, not approved replacements for schtasks.","Linux must connect appd's UI to the requesting client's desktop; startup timing alone does not settle that.","systemd documents support for only one graphical session per user. Reaching multiple simultaneous Linux desktops needs an additional UI connection/lifecycle design; the user unit alone does not provide it.","Autostart settings, retry policy and logging contents need approval before templates can be finalized.","Stop/configuration expand the recorded design; the original sixteen rules do not yet cover all of that work.","Current setup Detect/Repair methods are synchronous. The draft asynchronous entry interface needs an explicit integration decision.","The Windows mutex must be released on its acquiring thread; the current async lifetime sketch does not choose how to preserve that ownership."],"references":[{"title":"Apple launchd configuration","url":"https://developer.apple.com/library/archive/documentation/MacOSX/Conceptual/BPSystemStartup/Chapters/CreatingLaunchdJobs.html"},{"title":"Apple launchd.plist manual source","url":"https://github.com/apple-oss-distributions/launchd/blob/main/man/launchd.plist.5"},{"title":"systemd service semantics","url":"https://github.com/systemd/systemd/blob/main/man/systemd.service.xml"},{"title":"systemd enable, disable and environment","url":"https://github.com/systemd/systemd/blob/main/man/systemctl.xml"},{"title":"Windows task schema","url":"https://learn.microsoft.com/en-us/windows/win32/taskschd/task-scheduler-schema"},{"title":"Windows session-targeted start","url":"https://learn.microsoft.com/en-us/windows/win32/api/taskschd/nf-taskschd-iregisteredtask-runex"},{"title":"Windows stop one instance","url":"https://learn.microsoft.com/en-us/windows/win32/api/taskschd/nf-taskschd-irunningtask-stop"},{"title":"Windows restart limits","url":"https://learn.microsoft.com/en-us/windows/win32/taskschd/taskschedulerschema-restarttype-complextype"},{"title":"Windows executable action fields","url":"https://learn.microsoft.com/en-us/windows/win32/taskschd/taskschedulerschema-exectype-complextype"},{"title":"Linux desktop integration","url":"https://systemd.io/DESKTOP_ENVIRONMENTS/"},{"title":"Windows task battery and runtime settings","url":"https://learn.microsoft.com/en-us/windows/win32/taskschd/taskschedulerschema-settingstype-complextype"},{"title":"Windows concurrent task instances","url":"https://learn.microsoft.com/en-us/windows/win32/taskschd/taskschedulerschema-multipleinstancespolicy-settingstype-element"},{"title":"Process + start options — API reference","url":"https://learn.microsoft.com/en-us/dotnet/api/system.diagnostics.process?view=net-10.0"},{"title":"Process + start options — API reference","url":"https://learn.microsoft.com/en-us/dotnet/api/system.diagnostics.processstartinfo?view=net-10.0"},{"title":"FileStream lifetime — API reference","url":"https://learn.microsoft.com/en-us/dotnet/api/system.io.filestream.-ctor?view=net-10.0"},{"title":"Mutex lifetime — API reference","url":"https://learn.microsoft.com/en-us/dotnet/api/system.threading.mutex?view=net-10.0"},{"title":"Mutex lifetime — API reference","url":"https://learn.microsoft.com/en-us/dotnet/standard/threading/mutexes"},{"title":"Task Scheduler objects — API reference","url":"https://learn.microsoft.com/en-us/windows/win32/api/taskschd/nf-taskschd-itaskservice-connect"},{"title":"Task Scheduler objects — API reference","url":"https://learn.microsoft.com/en-us/windows/win32/api/taskschd/nf-taskschd-itaskfolder-registertask"},{"title":"Task Scheduler objects — API reference","url":"https://learn.microsoft.com/en-us/windows/win32/api/taskschd/nf-taskschd-iregisteredtask-getinstances"},{"title":"Task Scheduler objects — API reference","url":"https://learn.microsoft.com/en-us/windows/win32/api/taskschd/nf-taskschd-irunningtask-get_enginepid"},{"title":"Assembly resource streams — API reference","url":"https://learn.microsoft.com/en-us/dotnet/api/system.reflection.assembly.getmanifestresourcestream?view=net-10.0"},{"title":"Text readers + stream bridge — API reference","url":"https://learn.microsoft.com/en-us/dotnet/api/system.io.textreader?view=net-10.0"},{"title":"Text readers + stream bridge — API reference","url":"https://learn.microsoft.com/en-us/dotnet/api/system.io.streamreader.-ctor?view=net-10.0"},{"title":"Windows account identity — API reference","url":"https://learn.microsoft.com/en-us/dotnet/api/system.security.principal.windowsidentity.getcurrent?view=net-10.0"}],"rules":[{"rule":"OwnedPrimitives.cs: `System.Diagnostics.Process` and `ProcessStartInfo` resolve to `OwnedBy` the single `ProcessLauncherAdapter` in core `AgentGuard.CrossPlatform`, instead of today's `BannedEverywhere`.","failureModeStopped":"Verified live that `OwnedPrimitives.ResolveConsoleCryptoProcess` returns `BannedEverywhere` for both types, so the first implementer who needs to shell out to launchctl/systemctl/schtasks hits a hard build error with two visible escapes: a raw suppression at whatever call site they are standing in (an unapproved exception to a settled rule), or three separate ad hoc Process-owning classes scattered across the per-OS assemblies — the duplicated primitive-handling DRY rail 6 exists to prevent, invisible to the in-build analyzers because the copies live in different projects.","analyzer":"Table entry in the existing AG0011 `RawPrimitiveOnlyInOwnerAnalyzer` — one `OwnedPrimitives.cs` row plus a compliant/violating proving-test pair. Named by conversation.md as one of the two additions that fail the run outright if the contract does not carry it."},{"rule":"OwnedPrimitives.cs: `System.IO.FileStream` (reached today through `FilesystemMembers.StreamWatcherAndDriveTypes`) resolves to `OwnedBy` the POSIX `ISingleInstanceLock` implementer, gated by the existing `CrossPlatformBoundary.IsAnyPerOsImplementationLibrary`.","failureModeStopped":"Verified live that `ResolveStreamsAndEnumeration` returns `BannedEverywhere` for `FileStream`. Without the entry the implementer either takes the same suppression escape as above, or — worse — opens the exclusive-lock stream inside some other convenient class in the same per-OS assembly, silently un-concentrating the single-instance invariant that SOLID rail 1 requires stay in one owner.","analyzer":"Table entry in the existing AG0011 `RawPrimitiveOnlyInOwnerAnalyzer`, reusing the gate function AG0101 already defines for the filesystem owner. The second of the two additions conversation.md names as run-failing if omitted."},{"rule":"OwnedPrimitives.cs: add a BRAND-NEW entry for `System.Threading.Mutex` (construction, `WaitOne`, `ReleaseMutex`, `Dispose`) resolving to `OwnedBy` the Windows `ISingleInstanceLock` implementer, banned everywhere else.","failureModeStopped":"Verified by direct grep: `Mutex` has zero occurrences anywhere in `src`, `tests`, `analyzers`, or `eng`, and no entry in `OwnedPrimitives.cs`, `RawPrimitiveOnlyInOwnerAnalyzer.cs`, or `MemberUseScanner.cs` — so `new Mutex(...)` compiles clean today in every assembly, including `AgentGuard.Engine`, which is supposed to stay OS-agnostic and touch no OS synchronization primitive. This work is the first to need a named mutex at all; shipping it without the entry means the Windows half of \"exactly one runs at a time\" has no build-time fence and any class can mint a second named mutex. conversation.md leaves this open for RULE-PHASE; this is the recommendation to close it.","analyzer":"Third `OwnedPrimitives.cs` table row on the existing AG0011 analyzer, no new analyzer class."},{"rule":"No string, path, or command parameter on a daemon port. Every member of every interface named in `DaemonContracts.AllDaemonPorts` may declare parameters only from a closed allowlist: `System.Threading.CancellationToken`, `ISystemServices`, and the daemon DTOs named in `DaemonContracts`. A `string`, `char`, `IFileInfo`, or any other type is a build error.","failureModeStopped":"Two named failures at once. First, the caller telling the start port what to launch — spawning `~/.agentguard/bin/guard daemon` directly instead of asking the service manager — which is the second divergent startup mechanism #63's \"triggers that same canonical start rather than launching it some other way\" exists to forbid, and which produces a daemon that dies with the terminal. Second, a CLI probe and a starting daemon receiving separately-passed path strings and computing different lock paths, producing the two simultaneous daemons the Done-when rules out. Neither is policed; both become inexpressible. Compatible with AG0031 (verified), which independently bans a leaf boundary service as a method parameter while permitting the container.","analyzer":"New Roslyn symbol analyzer (`RegisterSymbolAction` on `NamedType`) resolving the port set from the `DaemonContracts` registry. Id for RULE-PHASE — AG0117 is the next free slot in the per-OS/family block (AG0101-AG0116 taken, verified)."},{"rule":"Each daemon port member has exactly one production caller, from a member-to-owner table in `DaemonContracts`: `ISingleInstanceLock.Acquire` to `AgentGuard.Setup.DaemonHost`; `ISingleInstanceLock.IsHeld` and `IServiceManagerStart.Start` to `AgentGuard.Setup.DaemonGate`; `ILoginRegistration.Register`/`Detect` to `AgentGuard.Setup.LoginRegistrationCondition`. Test assemblies exempt.","failureModeStopped":"A second check-and-start path bolted beside the gate, which turns #63's \"one canonical start path\" into a convention nobody enforces — the more likely because Tim's recorded decision is that there is no fixed list of commands that check ('multiple will need to call it inside of their service code'), so future callers will multiply. Also stops a verb reaching a port directly and skipping the fail-closed diagnosis, and stops `DaemonGate` 'helpfully' calling `Register` itself, which would perform an ApprovalGate-gated mutation from an ungated command.","analyzer":"New Roslyn operation analyzer on `OperationKind.Invocation`, a direct generalization of the shipped AG0108 `PresenceCheckOnlyFromApprovalGateAnalyzer` from one caller to a member-to-owner table."},{"rule":"Service-manager and shell tool names are banned outside the one per-OS `IServiceManagerStart` implementer. Value-scan on literal and folded-const string values: `launchctl`, `launchd`, `systemctl`, `systemd`, `schtasks`, `sh`, `/bin/sh`, `bash`, `zsh`, `cmd`, `cmd.exe`, `powershell`, `pwsh`, `sudo`, `pkexec`, `osascript`. The banned set is spelled once in `DaemonContracts`.","failureModeStopped":"Answering 'is appd running?' by shelling `launchctl print` / `systemctl --user is-active` / `schtasks /Query` — the exact three mechanisms Tim's recorded decision replaced with the lock ('three different tools with three different output formats to parse') — and any start routed through a shell script instead of the service manager. This rule is what makes the shared `IProcessLauncher` safe rather than a general shell-out: the launch mechanics live in one class, but every command line stays inside its one per-OS owner.","analyzer":"New Roslyn value-scan on `OperationKind.Literal` plus folded const `FieldReference`, a direct copy of the shipped AG0111 `NoAuthenticationAgentRegistrationAnalyzer` shape."},{"rule":"Runtime-root environment-variable names are banned outside the one per-OS lock-path owner. Value-scan on `TMPDIR`, `TEMP`, `TMP`, `XDG_RUNTIME_DIR`, `LOCALAPPDATA`, `APPDATA`, `HOME`, `USERPROFILE`.","failureModeStopped":"The exact dodge conversation.md names and forbids: reaching the shared macOS temp root through `IEnvironment.GetEnvironmentVariable(\"TMPDIR\")` rather than `GetTempDirectory()`, so AGS5443 never fires — 'a suppression by construction'. Verified that nothing in the tree catches this today: `TempRootBackDoorAnalyzer` matches only the member named `GetTempDirectory` on `IEnvironment`, and `EnvironmentAdapter.GetEnvironmentVariable` is a fully generic pass-through to `Environment.GetEnvironmentVariable(name)`. Also stops a second hand-rolled home-directory owner beside `IEnvironment.GetHomeDirectory`.","analyzer":"New Roslyn value-scan sharing the AG0111 mechanics with the tool-name rule above."},{"rule":"AGS5443 suppression allowlist. A `[SuppressMessage]` whose check id is `S5443` or whose rule id is `AGS5443` may appear only on the two identities named in `DaemonContracts`: the existing `EnvironmentAdapter.GetTempDirectory` site and the macOS-only lock-path fragment. Anywhere else — including a file- or assembly-level suppression — is a build error.","failureModeStopped":"Tim's macOS-scoped, personally-approved exemption sprawling into a general licence to reach the shared publicly-writable temp root. Specifically it stops the accident this design invites: the suppression landing on the link-shared POSIX lock file rather than the macOS-only fragment, which would compile into the Linux assembly too and silently widen the approved exemption to an OS where `$XDG_RUNTIME_DIR` is not the temp root and nothing was approved. Verified that `AgentGuard.CrossPlatform.Linux.csproj:29-31` link-shares the MacOS POSIX sources by `\u003cCompile Include ... Link>`, so this is a live hazard, not a hypothetical.","analyzer":"New Roslyn attribute-argument analyzer (`RegisterSymbolAction` over declared attributes, matching the first two `SuppressMessageAttribute` arguments)."},{"rule":"No broad catch inside a daemon port implementer, the shared `ProcessLauncherAdapter`, or `DaemonHost`. `catch (System.Exception)`, `catch (System.SystemException)`, and a bare `catch { }` are build errors in those types; a narrow named catch (`IOException`, `AbandonedMutexException`, `UnauthorizedAccessException`) stays legal.","failureModeStopped":"The fail-open conversion: swallowing the lock's `IOException` or `AbandonedMutexException` and continuing anyway, which yields two daemons from a check that reported success — the single thing #63's Done-when rules out. Also stops swallowing a start failure so the user gets silence instead of the message naming what went wrong, why, and how to fix it that Tim's recorded decision requires. The CLI's existing approved CA1031 fail-closed wrappers in `Program.cs` are outside the scoped types and unaffected.","analyzer":"New Roslyn operation analyzer on `OperationKind.CatchClause`, scoped to the `DaemonContracts` identities."},{"rule":"Daemon port implementers, the shared `ProcessLauncherAdapter`, and `DaemonGate` hold no MUTABLE state — no non-readonly field, no settable auto-property, no field-like event; `const` and `readonly` constructor-injected dependencies stay legal.","failureModeStopped":"A cached `_isRunning` or `_alreadyStarted` that goes stale and answers a later probe wrongly — fail-open: the gate skips the start and the user gets no daemon, with the check reporting success. JUDGE CORRECTION to risk-first, which proposed widening AG0116's candidate set: verified that AG0116 bans EVERY field with only `const` exempt, so widening it would forbid the start implementer's `private readonly IProcessLauncher` and break the constructor injection best-practices 6a mandates. The DRY-correct shape is a new descriptor on the shared `FieldOwnershipScan` skeleton — which already exists precisely so AG0112 and AG0116 do not copy each other, 'each supplies its own owner set, predicate, and descriptor'.","analyzer":"New diagnostic id reusing the existing `FieldOwnershipScan` skeleton with a mutable-state-only predicate and the `DaemonContracts` owner set — not a second stateless-implementer analyzer, which would itself be the DRY defect this repo fails most often."},{"rule":"Every interface declared in `AgentGuard.Abstractions.Contracts` that has a production implementer must either be reachable from the `ISystemServices` container walk, or be named in a closed internal-owner registry (`PresenceContracts` / `DaemonContracts`); every registry-named internal owner additionally gets the single-implementer check.","failureModeStopped":"Two named failures, one mechanism. First: `ISingleInstanceLock` or `ILoginRegistration` built correctly but the two-line `IPlatformServices` property addition dropped by a rebase or a copy-paste miss — verified that AG0025 derives its candidate set entirely from `BoundaryServices.Resolve()` starting at `ISystemServices`, so such an interface would have exactly one implementer today and ZERO protection against a second appearing later, with nothing in the existing rule set able to notice. Second: a stray second implementer of the internal `IProcessLauncher`, which is deliberately NOT on the container — verified that AG0025 cannot see it and that AG0114 is closed and presence-scoped by hand-named identity, so nothing today would catch it. This work adds a container, three Contracts interfaces, and one internal owner in a single pass, which is exactly when both blind spots bite.","analyzer":"New Roslyn analyzer beside AG0025, consuming the same `BoundaryServices` walk in the opposite direction and the shared `SecondImplementerGuard` algorithm AG0022/AG0025/AG0114 already use. Next free general-purpose id is AG0040 (AG0001-AG0039 assigned, AG0012/0013/0014/0016/0021/0028 retired — verified)."},{"rule":"Extend the existing AG0038 `TimeoutMustUseTimeProviderAnalyzer` to recognize `Process.WaitForExit(TimeSpan)` / `WaitForExit(int)` fed by a raw, non-TimeProvider-derived deadline as a governed bounded wait, forcing the `WaitForExitAsync(CancellationToken)` + TimeProvider-derived `CancellationTokenSource` path AG0038 already governs.","failureModeStopped":"A `process.WaitForExit(TimeSpan.FromSeconds(5))` inside `ProcessLauncherAdapter` is a real, un-fakeable wall-clock wait that slips past the exact rule built to prevent this class of defect, making every test that touches the launcher non-deterministic and slow. Verified live: `TimeoutMembers.cs` is the single source of truth for the bounded-wait members and knows only `Task.Delay`, `Task.WaitAsync`, the `CancellationTokenSource` constructor, and `CancelAfter`, plus AG0038's own `Thread.Sleep` — `Process` appears nowhere in it.","analyzer":"Extend the existing AG0038 analyzer and `TimeoutMembers.cs` recognizer — no new analyzer class, no new id."},{"rule":"No polling loop in `DaemonHost`. A `while`/`for`/`do`/`foreach` statement whose body contains a delay, a wait, or a lock probe is a build error; the idle wait is a single cancellation-linked await through `services.Clock`.","failureModeStopped":"The lazy way to make a process 'stay up' — a spin or poll loop burning CPU on every user's machine for the entire login session. A direct harm to the human that no existing rule catches: AG0038 forces a bounded wait through `TimeProvider` (verified) but says nothing about wrapping one in a loop.","analyzer":"New Roslyn operation analyzer on `OperationKind.Loop`, scoped to the `DaemonContracts.DaemonHost` identity. Lower confidence than the rules above on shape; RULE-PHASE to assess whether the loop-body predicate is worth its complexity."},{"rule":"Convention test — the login-registration identifiers and the launcher path are pinned. Each of the three identifiers (`com.4thwaiv.agentguard.appd`, `agentguard-appd.service`, `\\AgentGuard\\appd`) lives in exactly one C# const in its own per-OS class, mirroring `PolkitAction.Id`; a build-failing test on each OS leg asserts that the registration the code actually writes, and the launcher path it names, carry that exact const value and `MachinePaths.BinGuardIn`'s exact output. If a shipped template file under `eng/` is chosen instead of composing in code, the test pins the file's identifier equal to the const.","failureModeStopped":"Two named failures. First, the label drifting between what `install` writes and what `Start()` kickstarts — a typo or a rename that missed one call site — which fails SILENTLY: the start call returns success having started nothing, or `doctor`/`status` falsely reports 'not registered' against a real live registration, and the next login then produces a second daemon. Second, the registration pointing at `SetupContext.ResolvedBinaryPath` (the specific-version path of whatever binary happens to be running) instead of the stable `MachinePaths.BinGuardIn` launcher: both are plain strings, it compiles and passes a quick manual test, and then silently breaks autostart on the very next version upgrade once install prunes or replaces that version directory. This is the buildable form of the argument-shape analyzer simplest itself rated low-confidence.","analyzer":"Contract-directed convention test (xunit), per-OS leg — not a Roslyn analyzer. Direct reuse of the shipped `PolkitPolicyIntegrityTests` mechanism."},{"rule":"Convention test — every per-OS daemon port implementer is covered by its own `[Trait(\"Category\",\"NativeSpec\")]` pointed-integration spec test, discovered through the existing `[RequiresNativeSpecTest]` marker rather than a test-side list.","failureModeStopped":"A Windows or Linux daemon implementer sitting at 0% coverage and hiding under a per-assembly total that still clears the 75% floor — the exact hazard the presence work built this mechanism for, now reproduced by new per-OS classes each exercised on only one CI leg, and made worse because every recorded lock fact came from a macOS-only spike ('Nothing above was run on Linux or Windows'). RULE-PHASE must settle the wiring rather than assume it: verified that `RequiresNativeSpecTestAttribute` is `AttributeTargets.Interface` only and that `NativeSpecCoverageConventionTests` resolves required owners by scanning the per-OS PRODUCTION assembly, whereas the daemon ports are declared in `AgentGuard.Abstractions.Contracts` — so either the marker goes on internal per-OS re-declared ports or the test's resolution widens.","analyzer":"Contract-directed convention test (xunit), extending `NativeSpecCoverageConventionTests` — not a Roslyn analyzer."},{"rule":"Convention test — the approval-gated verb set is pinned. Assert that the set of CLI verbs whose handler path reaches `ApprovalGate.RequireApprovalAsync` is exactly {install, init, remove}, and that `daemon` and `status` are not among them.","failureModeStopped":"Both directions of gate drift. `daemon` acquiring a presence prompt would put an OS auth dialog in front of the user at every single login — the specific harm Tim named in his recorded decision ('it would be user jarring to be getting a check on login every time'). `install` silently losing the gate would take the login-registration write out from behind approval, which Tim's decision explicitly keeps ('install stays gated as it is today, so writing the login registration remains behind approval'). Verified live that `SetupCommands` Install/Init/Remove each call `ApprovalGate.RequireApprovalAsync` and that doctor/hook/version do not.","analyzer":"Contract-directed convention test (xunit) in `tests/AgentGuard.Cli.Tests` — not a Roslyn analyzer."}],"currentSources":{"src/AgentGuard.Engine/Setup/ISetupCondition.cs":"// Copyright (c) 4thWAIV. All rights reserved.\n\nnamespace AgentGuard.Setup;\n\n/// \u003csummary>\n/// One structural condition the setup surface establishes and reports. It is the single object that both\n/// \u003cc>install\u003c/c>/\u003cc>init\u003c/c> (which apply it) and \u003cc>doctor\u003c/c> (which detects and, with \u003cc>--fix\u003c/c>, repairs\n/// it) share, so the two never re-derive the same layout logic. Every repair routes through the shared creation\n/// helper.\n/// \u003c/summary>\ninternal interface ISetupCondition\n{\n    /// \u003csummary>\n    /// Gets the short, human-readable name printed by \u003cc>doctor\u003c/c>.\n    /// \u003c/summary>\n    string Name { get; }\n\n    /// \u003csummary>\n    /// Gets the scope this condition belongs to.\n    /// \u003c/summary>\n    SetupScope Scope { get; }\n\n    /// \u003csummary>\n    /// Detects the current state of the condition without changing anything.\n    /// \u003c/summary>\n    /// \u003cparam name=\"context\">The setup context.\u003c/param>\n    /// \u003creturns>The detected state.\u003c/returns>\n    ConditionState Detect(SetupContext context);\n\n    /// \u003csummary>\n    /// Establishes or corrects the condition through the shared creation helper. Conditions that must not be\n    /// fabricated (such as a hash record) return \u003csee cref=\"RepairKind.NotRepairable\"/>.\n    /// \u003c/summary>\n    /// \u003cparam name=\"context\">The setup context.\u003c/param>\n    /// \u003creturns>The repair outcome.\u003c/returns>\n    RepairOutcome Repair(SetupContext context);\n}\n","src/AgentGuard.Abstractions/Contracts/IPlatformServices.cs":"// Copyright (c) 4thWAIV. All rights reserved.\n\nnamespace AgentGuard.Abstractions.Contracts;\n\n/// \u003csummary>\n/// The container of the platform capabilities the engine depends on, obtained once from the per-OS\n/// \u003cc>PlatformServices.Create()\u003c/c> factory. It exposes one capability today, \u003csee cref=\"FileSystem\"/>, and is designed to\n/// grow — future capabilities (for example a biometric/keychain surface) become additional properties here with no\n/// restructuring of the factory or its callers.\n/// \u003c/summary>\npublic interface IPlatformServices\n{\n    /// \u003csummary>\n    /// Gets the platform's file-system capability.\n    /// \u003c/summary>\n    IPlatformFileSystem FileSystem { get; }\n\n    /// \u003csummary>\n    /// Gets the platform's presence capability — the per-OS \u003csee cref=\"IPresenceCheck\"/> the approval gate consumes to\n    /// prove a physically-present human before a mutating command proceeds.\n    /// \u003c/summary>\n    IPresenceCheck Presence { get; }\n}\n","src/AgentGuard.Abstractions/Contracts/IBuildInfo.cs":"// Copyright (c) 4thWAIV. All rights reserved.\n\nnamespace AgentGuard.Abstractions.Contracts;\n\n/// \u003csummary>\n/// The owned read of the running build's version metadata — the three already-stamped version attributes on a\n/// guard assembly. It only reads: the values are computed and stamped one way by the build, so it neither falls\n/// back nor recomputes, and it reads from a guard assembly rather than the ambient entry assembly (the test host\n/// under \u003cc>dotnet test\u003c/c>).\n/// \u003c/summary>\npublic interface IBuildInfo\n{\n    /// \u003csummary>\n    /// Gets the semantic version — the assembly's informational version.\n    /// \u003c/summary>\n    string SemVer { get; }\n\n    /// \u003csummary>\n    /// Gets the assembly version.\n    /// \u003c/summary>\n    string AssemblyVersion { get; }\n\n    /// \u003csummary>\n    /// Gets the file version.\n    /// \u003c/summary>\n    string FileVersion { get; }\n}\n","src/AgentGuard.Abstractions/Contracts/IPlatformFileSystem.cs":"// Copyright (c) 4thWAIV. All rights reserved.\n\nnamespace AgentGuard.Abstractions.Contracts;\n\n/// \u003csummary>\n/// The platform's file-system capability: the complete set of operations the engine needs that the managed BCL\n/// cannot do OS-uniformly — the version-pointer symlinks the machine layout depends on, the POSIX executable\n/// bit, per-filesystem case-sensitivity detection, and the OS-divergent raw path-separator value. It is a\n/// capability surface and is allowed to grow, but every member is part of one coherent complete set.\n/// Implementations are per-OS behind this locked interface; the engine consumes only the interface and stays\n/// OS-agnostic.\n/// \u003c/summary>\npublic interface IPlatformFileSystem\n{\n    /// \u003csummary>\n    /// Gets the OS-native directory-separator character (\u003cc>/\u003c/c> on POSIX, \u003cc>\\\u003c/c> on Windows). Reading the raw\n    /// \u003cc>Path.DirectorySeparatorChar\u003c/c> value is not input-deterministic, so it is owned here (per the Path-purity\n    /// rule) and every other site reaches the separator through this interface.\n    /// \u003c/summary>\n    char DirectorySeparator { get; }\n\n    /// \u003csummary>\n    /// Gets a value indicating whether the path is a symlink.\n    /// \u003c/summary>\n    /// \u003cparam name=\"linkPath\">The path to test.\u003c/param>\n    /// \u003creturns>\u003csee langword=\"true\"/> when \u003cparamref name=\"linkPath\"/> is a symlink; otherwise\n    /// \u003csee langword=\"false\"/> (a regular file, a directory, or absent).\u003c/returns>\n    bool IsLinkTarget(string linkPath);\n\n    /// \u003csummary>\n    /// Reads a symlink's raw (unresolved) target string.\n    /// \u003c/summary>\n    /// \u003cparam name=\"linkPath\">The path expected to be a symlink.\u003c/param>\n    /// \u003creturns>The raw target string the link points at, or \u003csee langword=\"null\"/> when\n    /// \u003cparamref name=\"linkPath\"/> is not a symlink (a regular file, a directory, or absent).\u003c/returns>\n    string? ReadLinkTarget(string linkPath);\n\n    /// \u003csummary>\n    /// Atomically points the symlink at \u003cparamref name=\"linkPath\"/> at \u003cparamref name=\"relativeTarget\"/>, creating\n    /// the link when it is absent and replacing it when it already exists — the link is never momentarily absent.\n    /// Any missing parent directory is created first. This operation is unconditional: it does not compare the\n    /// current target, so deciding whether a re-point is needed is the caller's concern. It refuses (throws) when\n    /// \u003cparamref name=\"linkPath\"/> holds a real file or directory rather than a symlink, so a real file is never\n    /// replaced by a link.\n    /// \u003c/summary>\n    /// \u003cparam name=\"linkPath\">The symlink path to create or replace.\u003c/param>\n    /// \u003cparam name=\"relativeTarget\">The relative target the link should resolve to.\u003c/param>\n    void MakeLinkTarget(string linkPath, string relativeTarget);\n\n    /// \u003csummary>\n    /// Removes the symlink at \u003cparamref name=\"linkPath\"/>, and only the link. The target the link points at —\n    /// whether a file or a directory, and everything inside it — is never touched. It refuses (throws) when\n    /// \u003cparamref name=\"linkPath\"/> holds a real file or directory rather than a symlink.\n    /// \u003c/summary>\n    /// \u003cparam name=\"linkPath\">The symlink path to remove.\u003c/param>\n    void RemoveLinkTarget(string linkPath);\n\n    /// \u003csummary>\n    /// Gets a value indicating whether this OS uses (or supports) the executable bit. It is hard \u003csee langword=\"true\"/>\n    /// on POSIX and hard \u003csee langword=\"false\"/> on Windows. Callers guard the other three executable-flag methods\n    /// on this, so the bit is touched only where the OS has one.\n    /// \u003c/summary>\n    /// \u003creturns>\u003csee langword=\"true\"/> on POSIX; \u003csee langword=\"false\"/> on Windows.\u003c/returns>\n    bool NeedsExecutableFlag();\n\n    /// \u003csummary>\n    /// Gets a value indicating whether the file at \u003cparamref name=\"path\"/> has its executable bit set. Valid only\n    /// where \u003csee cref=\"NeedsExecutableFlag\"/> is \u003csee langword=\"true\"/>; on Windows it throws.\n    /// \u003c/summary>\n    /// \u003cparam name=\"path\">The file path.\u003c/param>\n    /// \u003creturns>\u003csee langword=\"true\"/> when the executable bit is set (POSIX only).\u003c/returns>\n    bool IsExecutable(string path);\n\n    /// \u003csummary>\n    /// Adds the executable bit to the file at \u003cparamref name=\"path\"/> (POSIX \u003cc>chmod +x\u003c/c>), preserving its\n    /// existing read/write bits. Valid only where \u003csee cref=\"NeedsExecutableFlag\"/> is \u003csee langword=\"true\"/>; on\n    /// Windows it throws.\n    /// \u003c/summary>\n    /// \u003cparam name=\"path\">The file path.\u003c/param>\n    void MakeExecutable(string path);\n\n    /// \u003csummary>\n    /// Removes the executable bit from the file at \u003cparamref name=\"path\"/> (POSIX \u003cc>chmod -x\u003c/c>), preserving its\n    /// existing read/write bits. Valid only where \u003csee cref=\"NeedsExecutableFlag\"/> is \u003csee langword=\"true\"/>; on\n    /// Windows it throws.\n    /// \u003c/summary>\n    /// \u003cparam name=\"path\">The file path.\u003c/param>\n    void MakeNonExecutable(string path);\n\n    /// \u003csummary>\n    /// Gets a value indicating whether the file system backing \u003cparamref name=\"path\"/> is case-sensitive, detected\n    /// against the exact directory being searched. Case sensitivity is a property of the file system, not the OS —\n    /// it is neither always insensitive on Windows nor always sensitive on macOS — so it is probed per path.\n    /// \u003c/summary>\n    /// \u003cparam name=\"path\">The directory path whose backing file system is probed.\u003c/param>\n    /// \u003creturns>\u003csee langword=\"true\"/> when name matching against \u003cparamref name=\"path\"/> is case-sensitive.\u003c/returns>\n    bool IsCaseSensitive(string path);\n}\n"},"generatedAt":"2026-09-06T02:00:07.705Z","revision":"89323d5a8fbaa280a2652c3c57442874347ae0ba","workingTree":"M .dev/inprocess/63-appd-1-process/conversation.md\n?? .dev/inprocess/63-appd-1-process/appd-review.html\n?? .dev/inprocess/63-appd-1-process/autostart-research.md\n?? .dev/inprocess/63-appd-1-process/design-review-notes.md\n?? .dev/inprocess/63-appd-1-process/render-review.mjs\n?? .dev/inprocess/63-appd-1-process/review-model.json\n?? .dev/inprocess/63-appd-1-process/review-screenshots/\n?? .dev/inprocess/63-appd-1-process/review-view.html\n?? .playwright-mcp/","sourceHashes":[{"path":"src/AgentGuard.Abstractions/Contracts/IPlatformServices.cs","sha256":"83c077f04b10f3c85ffb40d90b51ccca81df081fc7f1677989723db6aa2d8e46"},{"path":"src/AgentGuard.Abstractions/Contracts/IPlatformFileSystem.cs","sha256":"72391769c575ba54bc6fff9161466df671548d7b17362df7371a34ce03c58030"},{"path":"src/AgentGuard.Abstractions/Contracts/ISystemServices.cs","sha256":"981d527a14c026fc7cb052dca9196f141e10cab5c872ee8af9f3d1878e18c642"},{"path":"src/AgentGuard.Abstractions/Contracts/IBuildInfo.cs","sha256":"1759e449023bd6d3371f6bc9b179a54d64742a801690a2399fc50a90672b2e31"},{"path":"src/AgentGuard.Engine/Setup/ISetupCondition.cs","sha256":"30664311d912e7b9ad4f2242d980f3af2af83b6b735a6b303041fc4184087c07"},{"path":"src/AgentGuard.Engine/Setup/SetupConditions.cs","sha256":"0e97bbba8619b0e2f440a6d5d07e1705098ebcba05bc989c111e6223631e4f15"},{"path":"src/AgentGuard.Engine/Setup/MachinePaths.cs","sha256":"260ee671b4110ff66864d4db921428bb8e620a2cd1081c05375b6f8016ff6a05"},{"path":".dev/inprocess/63-appd-1-process/conversation.md","sha256":"829bb528c0486a3a3537b1bc53cd786ea1700aafff7369e000c04806d3edb43a"},{"path":".dev/inprocess/63-appd-1-process/design-output.json","sha256":"fe8129a4dda850d0e486f8e1a16cab7c0675153dbe7f477b4a47cab344deb516"},{"path":".dev/inprocess/63-appd-1-process/autostart-research.md","sha256":"e21f57127d0c3482ace07141b0b7a48aae8f928618349bf367931cc0e92d5aed"},{"path":".dev/inprocess/63-appd-1-process/review-model.json","sha256":"305eda154c516b32f37cac63e2a8aacaaa6b756a9e865acbeb0c1317fe492cd5"},{"path":".dev/inprocess/63-appd-1-process/review-view.html","sha256":"6f35b552e9e8a27a5ac8296f5b85a5e7664be57b0283cbd93a68303000159c80"}]}</script>
  <script>
  (() => {
    const root = document.getElementById('appd-review');
    const model = JSON.parse(root.querySelector('[data-review-model]').textContent);
    const state = { tab:'interfaces', node:'runtime', path:'start', shape:'separate', grouping:'grouped', policy:'demand', rule:0 };
    const $ = selector => root.querySelector(selector);
    const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const pre = value => '<pre><code>' + esc(value) + '</code></pre>';
    const label = (name, value) => '<div class="review-label">' + esc(name) + '</div><div>' + esc(value) + '</div>';
    const names = ['Consumers','Top service interfaces','Middle-layer implementations','Platform container','OS abstraction & supporting interfaces','Per-OS implementations','OS / BCL owners'];
    const runtimeCode = () => {
      const node = model.nodes.find(n => n.id === 'runtime');
      if (state.shape !== 'combined') return node.code;
      return 'public interface IDaemonService\n{\n    bool IsRunning();\n    Task StartAsync(CancellationToken ct);\n    Task StopAsync(CancellationToken ct);\n    Task<AutostartEntryState> InspectAutostartAsync(CancellationToken ct);\n    Task SetAutostartEnabledAsync(bool enabled, CancellationToken ct);\n}\n\n// AutostartEntryState and further settings remain unwritten.';
    };
    const platformCode = () => state.grouping === 'grouped'
      ? model.nodes.find(n => n.id === 'platform').code
      : 'public interface IPlatformServices\n{\n    IPlatformFileSystem FileSystem { get; }\n    IPresenceCheck Presence { get; }\n    ISingleInstanceLock DaemonLock { get; }\n    IDaemonProcessControl DaemonProcess { get; }\n    IAutostartEntry AutostartEntry { get; }\n}\n\n// The same three leaf interfaces; no IPlatformDaemon container.';
    const nodeLabel = node => node.id === 'setup-implementation' && state.shape === 'setup' ? 'AutostartEntryCondition + setup' : node.label;
    const selectedCode = node => node.id === 'runtime' ? runtimeCode() : node.id === 'platform' ? platformCode() : node.id === 'setup-implementation' && state.shape === 'setup' ? '// Reuse ISetupCondition for install and doctor.\n// AutostartEntryCondition owns checking/repairing setup.\n// Configuration reaches the setup path, with no separate\n// IAutostartEntryService. Its user-facing entry is unwritten.\n// Existing Detect/Repair are synchronous; integration with\n// the draft async platform entry remains unresolved.' : node.code;
    const visibleNodes = () => model.nodes.filter(n => state.shape === 'separate' || n.id !== 'autostart-service');
    const active = node => node.paths.includes(state.path) || (state.shape === 'combined' && node.id === 'runtime' && state.path === 'configure');
    function updateMeta() {
      const elapsed = Math.max(0, Math.floor((Date.now() - Date.parse(model.generatedAt)) / 60000));
      $('[data-meta]').textContent = model.stage + ' · source ' + model.revision.slice(0,8) + ' · generated ' + elapsed + ' min ago · snapshot; not live';
    }
    function renderGraph() {
      const nodes = visibleNodes();
      if (!nodes.some(n => n.id === state.node)) state.node = 'runtime';
      $('[data-layers]').innerHTML = names.map((name, layer) => '<div class="review-layer"><div class="review-layer-name text-small">'+esc(name)+'</div><div class="review-nodes">'+nodes.filter(n => n.layer === layer).map(n => '<div class="review-node" data-node-position="'+n.id+'"><button type="button" class="btn btn-block" data-node="'+n.id+'" aria-pressed="'+(state.node === n.id)+'">'+esc(nodeLabel(n))+'</button><span class="review-node-status text-small">'+esc(n.status)+(active(n) ? ' · '+esc(state.path)+' path' : '')+'</span></div>').join('')+'</div></div>').join('');
      root.querySelectorAll('[data-node]').forEach(button => button.addEventListener('click', () => { state.node=button.dataset.node; renderGraph(); renderInterface(); }));
      requestAnimationFrame(drawEdges);
    }
    function drawEdges() {
      if (state.tab !== 'interfaces') return;
      const graph = $('.review-graph'), svg = $('.review-edges'), rect=graph.getBoundingClientRect();
      svg.setAttribute('viewBox', '0 0 '+rect.width+' '+rect.height);
      let edges = model.edges.filter(([a,b]) => visibleNodes().some(n=>n.id===a) && visibleNodes().some(n=>n.id===b));
      if (state.shape === 'combined') edges.push(['runtime','setup-implementation']);
      if (state.shape === 'setup') edges.push(['client','setup-implementation']);
      svg.innerHTML=edges.map(([a,b]) => {
        const from=$('[data-node-position="'+a+'"]'), to=$('[data-node-position="'+b+'"]');
        if (!from || !to) return '';
        const ar=from.getBoundingClientRect(), br=to.getBoundingClientRect();
        const x1=ar.left+ar.width/2-rect.left, y1=ar.bottom-rect.top, x2=br.left+br.width/2-rect.left, y2=br.top-rect.top;
        const selected=active(model.nodes.find(n=>n.id===a))&&active(model.nodes.find(n=>n.id===b));
        const bend=Math.max(10,Math.abs(y2-y1)/2);
        return '<path d="M '+x1+' '+y1+' C '+x1+' '+(y1+bend)+', '+x2+' '+(y2-bend)+', '+x2+' '+y2+'" fill="none" stroke="'+(selected?'var(--viz-series-1)':'var(--border)')+'" stroke-width="'+(selected?'2':'1')+'" opacity="'+(selected?'0.85':'0.55')+'"/>';
      }).join('');
    }
    function renderInterface() {
      const n=model.nodes.find(n=>n.id===state.node);
      const existing=n.currentPath ? model.currentSources[n.currentPath] : null;
      const links=n.rules.map(index=>'<button type="button" class="btn btn-ghost" data-open-rule="'+index+'">'+esc(model.ruleExamples[index].label)+'</button>').join('');
      const shapeNote=state.node==='runtime' ? (state.shape==='separate' ? 'Runtime operations in one interface; persistent autostart settings in another.' : state.shape==='combined' ? 'One interface exposes runtime operations and persistent autostart settings.' : 'Only runtime operations have a top service interface. The dashboard must reach setup for configuration.') : '';
      const visible = visibleNodes();
      const relations = model.edges.filter(([a,b]) => visible.some(item=>item.id===a) && visible.some(item=>item.id===b));
      if(state.shape==='combined') relations.push(['runtime','setup-implementation']);
      if(state.shape==='setup') relations.push(['client','setup-implementation']);
      const relationNames = ids => [...new Set(ids)].map(id=>nodeLabel(model.nodes.find(item=>item.id===id))).join(', ') || 'None shown';
      $('[data-interface-detail]').innerHTML='<h3>'+esc(nodeLabel(n))+'</h3>'+label('Review question',n.question)+(shapeNote?label('Selected grouping',shapeNote):'')+label('Status',n.status)+pre(selectedCode(n))+(existing?'<details><summary>Current declaration · '+esc(n.currentPath)+'</summary>'+pre(existing)+'</details>':label('Current declaration','Not present in the inspected source; shown above as a draft or mechanism outline.'))+'<div class="review-label">Related guardrails</div><div class="viz-row">'+links+'</div>';
      $('[data-interface-detail]').insertAdjacentHTML('beforeend',label('Called by / reached through',relationNames(relations.filter(([,b])=>b===n.id).map(([a])=>a)))+label('Calls / depends on',relationNames(relations.filter(([a])=>a===n.id).map(([,b])=>b))));
      if(n.sources) $('[data-interface-detail]').insertAdjacentHTML('beforeend','<div class="review-label">Native API references</div>'+n.sources.map((url,i)=>'<div><a href="'+esc(url)+'" target="_blank" rel="noreferrer">'+esc(n.label)+' · API '+(i+1)+'</a></div>').join(''));
      root.querySelectorAll('[data-open-rule]').forEach(b=>b.addEventListener('click',()=>{state.rule=Number(b.dataset.openRule);setTab('rules');}));
    }
    function renderPolicy() {
      const policy=model.policies.find(p=>p.id===state.policy);
      const headings=['Behavior','macOS','Linux','Windows'];
      $('[data-policy-detail]').innerHTML='<h3>'+esc(policy.label)+'</h3>'+label(policy.recommendation,policy.reason)+label('Tradeoff',policy.decision)+'<div class="review-policy-row review-policy-head">'+headings.map(h=>'<div>'+esc(h)+'</div>').join('')+'</div>'+policy.rows.map(row=>'<div class="review-policy-row">'+row.map((value,i)=>'<div>'+(i?'<span class="review-platform-label">'+headings[i]+': </span>':'')+esc(value)+'</div>').join('')+'</div>').join('');
      $('[data-logging]').innerHTML=label('Proposal',model.logging.proposal)+label('Reason',model.logging.reason)+pre(model.logging.draft)+label('Decision',model.logging.question);
      $('[data-blockers]').innerHTML=model.blockers.map(b=>'<div class="review-problem">'+esc(b)+'</div>').join('');
      $('[data-references]').innerHTML=model.references.map(r=>'<div><a href="'+esc(r.url)+'" target="_blank" rel="noreferrer">'+esc(r.title)+'</a></div>').join('');
    }
    function renderRules() {
      $('[data-rule-list]').innerHTML=model.rules.map((rule,i)=>'<div class="review-rule-item"><button type="button" class="btn btn-block" data-rule="'+i+'" aria-pressed="'+(i===state.rule)+'">'+(i+1)+'. '+esc(model.ruleExamples[i].label)+'</button></div>').join('');
      root.querySelectorAll('[data-rule]').forEach(b=>b.addEventListener('click',()=>{state.rule=Number(b.dataset.rule);renderRules();}));
      const rule=model.rules[state.rule], example=model.ruleExamples[state.rule];
      $('[data-rule-detail]').innerHTML='<h3>'+esc(example.label)+'</h3>'+label('Before approval',example.review)+label('Recorded wording — verbatim',rule.rule)+label('Enforcement — verbatim',rule.analyzer)+'<div class="review-code-pair"><div><div class="review-label">Violating example · illustrative</div>'+pre(example.bad)+'</div><div><div class="review-label">Compliant direction · illustrative</div>'+pre(example.good)+'</div></div><details><summary>Failure this rule was proposed to stop — verbatim</summary><div>'+esc(rule.failureModeStopped)+'</div></details>';
    }
    function setTab(tab) {
      state.tab=tab;
      root.querySelectorAll('[data-panel]').forEach(p=>{p.hidden=p.dataset.panel!==tab;});
      root.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));
      if(tab==='interfaces'){renderGraph();renderInterface();}
      if(tab==='autostart')renderPolicy();
      if(tab==='rules')renderRules();
    }
    root.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
    root.querySelectorAll('[data-path]').forEach(b=>b.addEventListener('click',()=>{state.path=b.dataset.path;root.querySelectorAll('[data-path]').forEach(other=>other.setAttribute('aria-pressed',String(other===b)));renderGraph();}));
    $('[data-top-shape]').addEventListener('change',event=>{state.shape=event.target.value;state.node='runtime';renderGraph();renderInterface();});
    $('[data-grouping]').addEventListener('change',event=>{state.grouping=event.target.value;state.node='platform';renderGraph();renderInterface();});
    $('[data-policy]').addEventListener('change',event=>{state.policy=event.target.value;renderPolicy();});
    $('[data-discuss]').addEventListener('click',async()=>{
      const note=$('[data-feedback]').value.trim();
      let selected;
      if(state.tab==='interfaces'){const n=model.nodes.find(n=>n.id===state.node);selected=nodeLabel(n)+'\n'+selectedCode(n)+'\nReview question: '+n.question+'\nTop grouping: '+state.shape+'; platform grouping: '+state.grouping;}
      else if(state.tab==='rules'){const r=model.rules[state.rule];selected='Rule: '+model.ruleExamples[state.rule].label+'\n'+r.rule+'\nEnforcement: '+r.analyzer+'\nReview issue: '+model.ruleExamples[state.rule].review;}
      else{const p=model.policies.find(p=>p.id===state.policy);selected=p.label+'\n'+p.decision+'\n'+JSON.stringify(p.rows)+'\nLogging proposal: '+model.logging.draft;}
      const prompt='Discuss this appd design-review selection. This is not approval.\nSnapshot: '+model.generatedAt+'; source revision '+model.revision+'\n'+selected+'\nMy question/change: '+(note||'Explain the mechanism and the tradeoff so we can decide it.');
      const status=$('[data-feedback-status]');
      try {
        if(window.openai && typeof window.openai.sendFollowUpMessage==='function'){
          await window.openai.sendFollowUpMessage({prompt,title:'Discuss appd design selection'});
          status.textContent='Discussion requested. No approval recorded.';
        } else {
          $('[data-fallback]').hidden=false;$('[data-fallback]').value=prompt;status.textContent='Copy the selected discussion text into the conversation.';
        }
      } catch(error){$('[data-fallback]').hidden=false;$('[data-fallback]').value=prompt;status.textContent='Could not open the discussion. Copy the text below.';}
    });
    $('[data-provenance]').innerHTML=label('Generated at',model.generatedAt)+label('Revision',model.revision)+label('Working tree at generation',model.workingTree)+model.sourceHashes.map(s=>'<div>'+esc(s.path)+'<br>'+esc(s.sha256)+'</div>').join('');
    new ResizeObserver(()=>requestAnimationFrame(drawEdges)).observe($('.review-graph'));
    updateMeta();setInterval(updateMeta,60000);renderGraph();renderInterface();renderPolicy();renderRules();
  })();
  </script>
</div>
