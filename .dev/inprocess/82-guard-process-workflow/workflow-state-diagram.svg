<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1660" viewBox="0 0 1200 1660" role="img" aria-labelledby="title description">
  <title id="title">Guard workflow — stages and correction loops</title>
  <desc id="description">Visual alternative to the state diagram in conversation.md. Forward flow runs down the center. Same-stage revisions loop on the right. Returns to earlier stages run on the left. All existing states and transitions are preserved; level-dependent paths remain undefined.</desc>
  <metadata>Source: conversation.md, Workflow state diagram. Visual alternative only. State groups carry data-state; every transition path carries data-from, data-to, and its exact Mermaid data-label. The two [*] endpoints are start and finish, not workflow stages.</metadata>
  <defs>
    <marker id="arrow-forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526477" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#846391" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-architecture" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#337d85" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .state-label { font-size:18px; font-weight:650; text-anchor:middle; dominant-baseline:middle; letter-spacing:.5px; }
      .work rect { fill:#eaf2fc; stroke:#7298c0; } .work text { fill:#234c75; }
      .check rect { fill:#fff4dd; stroke:#c4a15a; } .check text { fill:#755517; }
      .endpoint rect { fill:#eaf5ee; stroke:#73a287; } .endpoint text { fill:#2b6242; }
      .state rect { stroke-width:1.5; }
      .forward,.self,.correction,.architecture-return { fill:none; stroke-width:2.3; stroke-linejoin:round; stroke-linecap:round; }
      .forward { stroke:#526477; marker-end:url(#arrow-forward); }
      .self,.correction { stroke:#846391; marker-end:url(#arrow-loop); }
      .architecture-return { stroke:#337d85; marker-end:url(#arrow-architecture); }
      .loop-label { fill:#755581; font-size:16px; font-weight:500; }
    </style>
  </defs>
  <rect width="1200" height="1660" fill="#fbfcfe"/>
  <text x="60" y="53" fill="#23374b" font-size="30" font-weight="700">Guard workflow</text>
  <text x="60" y="83" fill="#607285" font-size="16">Stages in order, with the correction loops defined so far.</text>
  <g font-size="13" fill="#607285">
    <rect x="710" y="45" width="12" height="12" rx="3" fill="#eaf2fc" stroke="#7298c0"/><text x="730" y="56">Work</text>
    <rect x="800" y="45" width="12" height="12" rx="3" fill="#fff4dd" stroke="#c4a15a"/><text x="820" y="56">Check</text>
    <rect x="895" y="45" width="12" height="12" rx="3" fill="#eaf5ee" stroke="#73a287"/><text x="915" y="56">Start / terminal</text>
  </g>
  <line x1="60" y1="107" x2="1140" y2="107" stroke="#dce4ed"/>
  <circle cx="620" cy="130" r="7" fill="#526477"/>
  <g id="transitions">
    <path id="edge--Conversation" data-from="[*]" data-to="Conversation" data-label="" class="forward" d="M620 138 V160"/>
    <path id="edge-Conversation-GROUND" data-from="Conversation" data-to="GROUND" data-label="" class="forward" d="M620 226 V248"/>
    <path id="edge-GROUND-DESIGN" data-from="GROUND" data-to="DESIGN" data-label="" class="forward" d="M620 314 V336"/>
    <path id="edge-DESIGN-CONTRACT" data-from="DESIGN" data-to="CONTRACT" data-label="" class="forward" d="M620 402 V424"/>
    <path id="edge-CONTRACT-SPEC" data-from="CONTRACT" data-to="SPEC" data-label="" class="forward" d="M620 490 V512"/>
    <path id="edge-SPEC-ARCHITECTURE" data-from="SPEC" data-to="ARCHITECTURE" data-label="" class="forward" d="M620 578 V600"/>
    <path id="edge-ARCHITECTURE-RULE_PLAN" data-from="ARCHITECTURE" data-to="RULE_PLAN" data-label="" class="forward" d="M620 666 V688"/>
    <path id="edge-RULE_PLAN-RULE" data-from="RULE_PLAN" data-to="RULE" data-label="" class="forward" d="M620 754 V776"/>
    <path id="edge-RULE-TEST_PLAN" data-from="RULE" data-to="TEST_PLAN" data-label="" class="forward" d="M620 842 V864"/>
    <path id="edge-TEST_PLAN-TEST" data-from="TEST_PLAN" data-to="TEST" data-label="" class="forward" d="M620 930 V952"/>
    <path id="edge-TEST-IMPLEMENT" data-from="TEST" data-to="IMPLEMENT" data-label="" class="forward" d="M620 1018 V1040"/>
    <path id="edge-IMPLEMENT-READINESS" data-from="IMPLEMENT" data-to="READINESS" data-label="" class="forward" d="M620 1106 V1128"/>
    <path id="edge-READINESS-REFUTE" data-from="READINESS" data-to="REFUTE" data-label="" class="forward" d="M620 1194 V1216"/>
    <path id="edge-REFUTE-GATE" data-from="REFUTE" data-to="GATE" data-label="" class="forward" d="M620 1282 V1304"/>
    <path id="edge-GATE-REPORT" data-from="GATE" data-to="REPORT" data-label="" class="forward" d="M620 1370 V1392"/>
    <path id="edge-REPORT-REVIEW" data-from="REPORT" data-to="REVIEW" data-label="" class="forward" d="M620 1458 V1480"/>
    <path id="edge-REVIEW-" data-from="REVIEW" data-to="[*]" data-label="" class="forward" d="M620 1546 V1580"/>
    <path id="edge-DESIGN-DESIGN" data-from="DESIGN" data-to="DESIGN" data-label="Human requests revision" class="self" d="M750 359 C866 324,866 426,760 390"/>
    <path id="edge-ARCHITECTURE-ARCHITECTURE" data-from="ARCHITECTURE" data-to="ARCHITECTURE" data-label="Stage review fails" class="self" d="M750 623 C866 588,866 690,760 654"/>
    <path id="edge-RULE-RULE" data-from="RULE" data-to="RULE" data-label="Stage review fails" class="self" d="M750 799 C866 764,866 866,760 830"/>
    <path id="edge-TEST-TEST" data-from="TEST" data-to="TEST" data-label="Stage review fails" class="self" d="M750 975 C866 940,866 1042,760 1006"/>
    <path id="edge-TEST-ARCHITECTURE" data-from="TEST" data-to="ARCHITECTURE" data-label="Architecture change needed for testing" class="architecture-return" d="M490 978 H462 Q430 978 430 946 V662 Q430 638 454 638 H480"/>
    <path id="edge-REFUTE-RULE" data-from="REFUTE" data-to="RULE" data-label="Analyzer-rule defect" class="correction" d="M490 1238 H126 Q100 1238 100 1212 V840 Q100 814 126 814 H480"/>
    <path id="edge-REFUTE-TEST" data-from="REFUTE" data-to="TEST" data-label="Test defect or missing coverage" class="correction" d="M490 1254 H236 Q210 1254 210 1228 V1016 Q210 990 236 990 H480"/>
    <path id="edge-REFUTE-IMPLEMENT" data-from="REFUTE" data-to="IMPLEMENT" data-label="Implementation defect" class="correction" d="M490 1270 H346 Q320 1270 320 1244 V1104 Q320 1078 346 1078 H480"/>
  </g>
  <g id="states">
    <g id="state-Conversation" data-state="Conversation" class="state endpoint"><rect x="490" y="170" width="260" height="56" rx="13"/><text x="620" y="199" class="state-label">Conversation</text></g>
    <g id="state-GROUND" data-state="GROUND" class="state work"><rect x="490" y="258" width="260" height="56" rx="13"/><text x="620" y="287" class="state-label">GROUND</text></g>
    <g id="state-DESIGN" data-state="DESIGN" class="state work"><rect x="490" y="346" width="260" height="56" rx="13"/><text x="620" y="375" class="state-label">DESIGN</text></g>
    <g id="state-CONTRACT" data-state="CONTRACT" class="state work"><rect x="490" y="434" width="260" height="56" rx="13"/><text x="620" y="463" class="state-label">CONTRACT</text></g>
    <g id="state-SPEC" data-state="SPEC" class="state work"><rect x="490" y="522" width="260" height="56" rx="13"/><text x="620" y="551" class="state-label">SPEC</text></g>
    <g id="state-ARCHITECTURE" data-state="ARCHITECTURE" class="state work"><rect x="490" y="610" width="260" height="56" rx="13"/><text x="620" y="639" class="state-label">ARCHITECTURE</text></g>
    <g id="state-RULE_PLAN" data-state="RULE_PLAN" class="state work"><rect x="490" y="698" width="260" height="56" rx="13"/><text x="620" y="727" class="state-label">RULE_PLAN</text></g>
    <g id="state-RULE" data-state="RULE" class="state work"><rect x="490" y="786" width="260" height="56" rx="13"/><text x="620" y="815" class="state-label">RULE</text></g>
    <g id="state-TEST_PLAN" data-state="TEST_PLAN" class="state work"><rect x="490" y="874" width="260" height="56" rx="13"/><text x="620" y="903" class="state-label">TEST_PLAN</text></g>
    <g id="state-TEST" data-state="TEST" class="state work"><rect x="490" y="962" width="260" height="56" rx="13"/><text x="620" y="991" class="state-label">TEST</text></g>
    <g id="state-IMPLEMENT" data-state="IMPLEMENT" class="state work"><rect x="490" y="1050" width="260" height="56" rx="13"/><text x="620" y="1079" class="state-label">IMPLEMENT</text></g>
    <g id="state-READINESS" data-state="READINESS" class="state check"><rect x="490" y="1138" width="260" height="56" rx="13"/><text x="620" y="1167" class="state-label">READINESS</text></g>
    <g id="state-REFUTE" data-state="REFUTE" class="state check"><rect x="490" y="1226" width="260" height="56" rx="13"/><text x="620" y="1255" class="state-label">REFUTE</text></g>
    <g id="state-GATE" data-state="GATE" class="state check"><rect x="490" y="1314" width="260" height="56" rx="13"/><text x="620" y="1343" class="state-label">GATE</text></g>
    <g id="state-REPORT" data-state="REPORT" class="state work"><rect x="490" y="1402" width="260" height="56" rx="13"/><text x="620" y="1431" class="state-label">REPORT</text></g>
    <g id="state-REVIEW" data-state="REVIEW" class="state endpoint"><rect x="490" y="1490" width="260" height="56" rx="13"/><text x="620" y="1519" class="state-label">REVIEW</text></g>
  </g>
  <g id="loop-labels">
    <text x="870" y="379" class="loop-label">Human requests revision</text>
    <text x="870" y="643" class="loop-label">Stage review fails</text>
    <text x="870" y="819" class="loop-label">Stage review fails</text>
    <text x="870" y="995" class="loop-label">Stage review fails</text>
    <text x="207" y="598" fill="#337d85" font-size="16" font-weight="500"><tspan x="207">Architecture change</tspan><tspan x="207" dy="21">needed for testing</tspan></text>
    <text x="134" y="792" class="loop-label">Analyzer-rule defect</text>
    <text x="241" y="953" class="loop-label"><tspan x="241">Test defect or</tspan><tspan x="241" dy="20">missing coverage</tspan></text>
    <text x="281" y="1058" class="loop-label">Implementation defect</text>
  </g>
  <circle cx="620" cy="1595" r="11" fill="none" stroke="#526477" stroke-width="2"/>
  <circle cx="620" cy="1595" r="6" fill="#526477"/>
  <text x="60" y="1634" fill="#69798a" font-size="13">Visual alternative to conversation.md · Level-dependent paths are not yet defined.</text>
</svg>
