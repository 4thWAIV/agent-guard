<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130" role="img" aria-labelledby="title desc">
<title id="title">CONTRACT — unresolved decisions block the exit</title>
<desc id="desc">The hidden-decision scan reads Contract and saves its results. The exit check reads those results and the recorded decisions. An unresolved required choice blocks exit. Resolve it, record the approved decision in Contract, and check the affected requirements again. Only a satisfied exit check can reach transition approval and SPEC.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#20364b;font-size:20px}.title{font-size:30px;font-weight:700}.heading{font-size:23px;font-weight:700}.small{font-size:17px}.label{font-size:17px;font-weight:700;letter-spacing:1px}.file{fill:#eaf5ee;stroke:#508264;stroke-width:2}.process{fill:#edf3fc;stroke:#7192b4;stroke-width:2}.blocked{fill:#fff0e7;stroke:#b25b36;stroke-width:2}.line{fill:none;stroke:#657d92;stroke-width:2;marker-end:url(#arrow)}.dependency{stroke-dasharray:7 5}.stop{fill:#813615}.green{fill:#2d6844}</style>
<rect width="1200" height="1130" fill="#fbfcfe"/>
<text x="50" y="54" class="title">CONTRACT: what blocks leaving the stage?</text>
<text x="50" y="88">The exit check reads the working files—not an agent’s completion claim.</text>

<path class="file" d="M130 135 H560 L590 165 V235 H130 Z"/>
<path d="M560 135 V165 H590" fill="none" stroke="#508264" stroke-width="2"/>
<text x="158" y="166" class="label">INPUT FILE</text>
<text x="158" y="194" class="heading">Contract</text>
<text x="158" y="221" class="small">Requirements and recorded decisions</text>
<path class="line" d="M360 235 V278"/>
<rect class="process" x="130" y="290" width="460" height="85" rx="16"/>
<text x="360" y="326" class="heading" text-anchor="middle">Hidden-decision scan</text>
<text x="360" y="353" class="small" text-anchor="middle">Find required choices that remain undecided</text>
<path class="line" d="M360 375 V418"/>
<path class="file" d="M130 430 H560 L590 460 V530 H130 Z"/>
<path d="M560 430 V460 H590" fill="none" stroke="#508264" stroke-width="2"/>
<text x="158" y="460" class="label">OUTPUT FILE → EXIT-CHECK INPUT</text>
<text x="158" y="489" class="heading">Saved scan results</text>
<text x="158" y="516" class="small">Keep the original findings</text>
<path class="line" d="M360 530 V583"/>
<path class="line dependency" d="M130 186 H72 V659 H118"/>
<text x="57" y="407" class="small" text-anchor="middle" transform="rotate(-90 57 407)">Read decisions from Contract</text>

<rect x="130" y="595" width="460" height="142" rx="5" fill="#fff7df" stroke="#a28435" stroke-width="2.5"/>
<text x="360" y="628" class="label" text-anchor="middle">CONTRACT EXIT CHECK</text>
<text x="360" y="664" class="heading" text-anchor="middle">Every required choice resolved</text>
<text x="360" y="695" class="heading" text-anchor="middle">and recorded in Contract?</text>
<text x="360" y="722" class="small" text-anchor="middle">An open issue or assigned follow-up is not resolution.</text>

<path class="line" d="M590 657 H718" style="stroke:#b25b36"/>
<text x="650" y="640" class="label stop" text-anchor="middle">NO</text>
<rect class="blocked" x="730" y="612" width="375" height="95" rx="8"/>
<text x="917" y="649" class="heading stop" text-anchor="middle">CONTRACT exit blocked</text>
<text x="917" y="679" text-anchor="middle">Identify the unresolved choice</text>
<path class="line" d="M917 707 V751" style="stroke:#b25b36"/>
<rect class="process" x="730" y="763" width="375" height="100" rx="16"/>
<text x="917" y="801" class="heading" text-anchor="middle">Resolve the choice</text>
<text x="917" y="833" text-anchor="middle">Human approval where required</text>
<path class="line" d="M917 863 V907"/>
<rect class="process" x="730" y="919" width="375" height="105" rx="16"/>
<text x="917" y="956" class="heading" text-anchor="middle">Record the decision in Contract</text>
<text x="917" y="987" class="small" text-anchor="middle">Check the affected requirements again</text>
<path class="line" d="M1105 973 H1145 V185 H602"/>
<text x="837" y="171" class="small" text-anchor="middle">Update the same Contract—not a second decision list</text>

<path class="line" d="M360 737 V813" style="stroke:#508264"/>
<text x="377" y="781" class="label green">YES</text>
<rect class="process" x="130" y="825" width="460" height="80" rx="16"/>
<text x="360" y="873" class="heading" text-anchor="middle">Required transition approval</text>
<path class="line" d="M360 905 V947"/>
<rect class="process" x="130" y="959" width="460" height="65" rx="16"/>
<text x="360" y="1000" class="heading" text-anchor="middle">SPEC</text>
<text x="50" y="1081" class="heading">Unfinished item → blocked work → saved resolution → exit check</text>
<text x="50" y="1110" class="small">File roles are shown here; this does not introduce new file schemas or automatic transition permissions.</text>
</svg>
