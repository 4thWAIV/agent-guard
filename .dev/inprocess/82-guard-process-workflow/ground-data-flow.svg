<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1740" viewBox="0 0 1440 1740" role="img" aria-labelledby="title description">
<title id="title">GROUND process and file flow</title>
<desc id="description">Inputs enter exploration, prior-art search, reuse evaluation and platform research. Guard saves each output unchanged. The saved search result becomes the reuse judge's input. Guard links search and evaluation results in the prior-art ledger. DESIGN reads original saved outputs. Undefined structures are dashed. Platform research's position in the sequence remains undecided.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#536b80" stroke-width="1.8"/></marker>
<marker id="handoff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#795099" stroke-width="1.8"/></marker>
<style>
text {font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#20364b}
.title {font-size:22px;font-weight:650}.body {font-size:18px}.small {font-size:16px;fill:#52677a}
.column {font-size:16px;font-weight:700;letter-spacing:1.3px}
.file {fill:#eaf5ee;stroke:#67977a;stroke-width:1.5}
.process {fill:#eaf2fc;stroke:#7298c0;stroke-width:1.5}
