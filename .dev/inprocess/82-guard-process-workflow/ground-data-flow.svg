<text x="45" y="53" font-size="33" font-weight="700">GROUND — process and file flow</text>
<text x="45" y="86" class="body">Matching file names identify the same saved artifact. Each reused input names the process that produced it.</text>
<rect x="45" y="114" width="1350" height="91" rx="12" class="file"/>
<text x="65" y="148" class="title">Workflow file: stage → attempt → assignments → agent runs</text>
<text x="65" y="182" class="small">Guard dispatches registered work and records result references. Conversation remains the instruction owner.</text>
<text x="45" y="242" class="column">INPUT FILES / SOURCES</text>
<text x="475" y="242" class="column">GROUND PROCESS</text>
<text x="940" y="242" class="column">PERSISTED OUTPUT FILES</text>
<line x1="45" y1="260" x2="1395" y2="260" class="line"/>
<rect x="45" y="290" width="350" height="150" rx="12" class="file"/>
<text x="65" y="324" class="title">Conversation + project files</text>
<text x="65" y="358" class="body">Selected investigation area</text>
<text x="65" y="386" class="body">Scope and exclusions</text>
<text x="65" y="414" class="small">Actual working-tree code</text>
<rect x="475" y="290" width="315" height="150" rx="12" class="process"/>
<text x="495" y="324" class="title">Exploration agent</text>
<text x="495" y="358" class="body">Investigates its assigned area</text>
<text x="495" y="386" class="body">Returns facts and evidence</text>
<text x="495" y="414" class="small">One result per assignment</text>
<rect x="940" y="290" width="400" height="150" rx="12" class="file open"/>
<text x="960" y="324" class="title">Exploration-result file</text>
<text x="960" y="358" class="body">Facts, evidence, open questions</text>
<text x="960" y="386" class="body">Affected files and stores</text>
<text x="960" y="414" class="small">Exact structure still undefined</text>
